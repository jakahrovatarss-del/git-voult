<svg viewBox="0 0 820 480" xmlns="http://www.w3.org/2000/svg">
  <title>Uklon palice (1) — dopustna sila S, triangularna konstrukcija</title>
  <rect width="820" height="480" fill="#ffffff"/>

  <text x="410" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">Uklon palice (1) — triangularna konstrukcija, jeklo</text>

  <!-- ===== LEVA STRAN: KONSTRUKCIJA ===== -->
  <text x="185" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Konstrukcija</text>

  <!-- Koordinatni sistem -->
  <!-- A=(80,350), B=(380,350), C=(380,50) v pikslih -->
  <!-- Scale: 3m = 300px, 3m = 300px -->

  <!-- Horizontalna linija (razdalja A-B) -->
  <line x1="80" y1="350" x2="380" y2="350" stroke="#aaa" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- Vertikala B-C -->
  <line x1="380" y1="350" x2="380" y2="60" stroke="#94a3b8" stroke-width="2"/>
  <text x="395" y="210" font-size="11" fill="#94a3b8">3 m</text>

  <!-- PALICA (1): diagonala A-C -->
  <line x1="80" y1="350" x2="380" y2="60" stroke="#1d4ed8" stroke-width="3"/>
  <!-- Oznaka palice 1 -->
  <circle cx="222" cy="212" r="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="222" y="217" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">1</text>
  <text x="175" y="195" font-size="11" fill="#1d4ed8">L = 3√2 m</text>
  <text x="155" y="210" font-size="11" fill="#1d4ed8">= 424,26 cm</text>

  <!-- Kot 45° pri A -->
  <path d="M 115 350 A 35 35 0 0 0 104.8 326" stroke="#16a34a" stroke-width="1.5" fill="none"/>
  <text x="125" y="338" font-size="12" fill="#16a34a" font-weight="bold">45°</text>

  <!-- Razpon 3m pri dnu -->
  <line x1="80" y1="370" x2="380" y2="370" stroke="#555" stroke-width="1"/>
  <line x1="80" y1="365" x2="80" y2="375" stroke="#555" stroke-width="1.5"/>
  <line x1="380" y1="365" x2="380" y2="375" stroke="#555" stroke-width="1.5"/>
  <text x="230" y="388" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">3 m</text>

  <!-- Podpora A (členkasta, levo-spodaj) -->
  <polygon points="80,350 65,378 95,378" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="55" y1="378" x2="105" y2="378" stroke="#888" stroke-width="2"/>
  <line x1="55" y1="382" x2="63" y2="390" stroke="#888" stroke-width="1.5"/>
  <line x1="67" y1="382" x2="75" y2="390" stroke="#888" stroke-width="1.5"/>
  <line x1="79" y1="382" x2="87" y2="390" stroke="#888" stroke-width="1.5"/>
  <line x1="91" y1="382" x2="99" y2="390" stroke="#888" stroke-width="1.5"/>
  <text x="65" y="405" font-size="12" fill="#1d4ed8" font-weight="bold">A</text>

  <!-- Podpora B (členkasta, desno-spodaj) -->
  <polygon points="380,350 365,378 395,378" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="355" y1="378" x2="405" y2="378" stroke="#888" stroke-width="2"/>
  <line x1="355" y1="382" x2="363" y2="390" stroke="#888" stroke-width="1.5"/>
  <line x1="367" y1="382" x2="375" y2="390" stroke="#888" stroke-width="1.5"/>
  <line x1="379" y1="382" x2="387" y2="390" stroke="#888" stroke-width="1.5"/>
  <line x1="391" y1="382" x2="399" y2="390" stroke="#888" stroke-width="1.5"/>
  <text x="368" y="405" font-size="12" fill="#1d4ed8" font-weight="bold">B</text>

  <!-- Vozlišče C (zgoraj-desno) -->
  <circle cx="380" cy="60" r="5" fill="#dc2626"/>
  <text x="388" y="58" font-size="12" fill="#1d4ed8" font-weight="bold">C</text>

  <!-- Sila S vodoravno levo pri C -->
  <defs>
    <marker id="arr_s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr_n" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <!-- S pointing left (compresses diagonal) -->
  <line x1="480" y1="60" x2="392" y2="60" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr_s)"/>
  <text x="490" y="55" font-size="14" fill="#dc2626" font-weight="bold">S</text>
  <text x="470" y="72" font-size="10" fill="#dc2626">(vodoravno)</text>

  <!-- Notranja sila N1 vzdolž palice -->
  <line x1="100" y1="333" x2="140" y2="295" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr_n)"/>
  <text x="75" y="280" font-size="11" fill="#7c3aed">N₁ = S√2</text>
  <text x="72" y="294" font-size="11" fill="#7c3aed">(tlak)</text>

  <!-- ===== DESNA STRAN: PREREZ ===== -->
  <line x1="530" y1="40" x2="530" y2="440" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="675" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Prerez palice — I-profil</text>

  <!-- I-profil: H=12cm (scale 18px/cm), B=8cm, tf=1cm, tw=1cm -->
  <!-- Center at (675, 240) -->
  <!-- Total: 216x144 px at 18px/cm, scaled to fit: use 15px/cm -->
  <!-- H=12cm=180px, B=8cm=120px, tf=1cm=15px, tw=1cm=15px -->
  <!-- hw=10cm=150px -->

  <!-- Bottom flange -->
  <rect x="615" y="330" width="120" height="15" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>
  <!-- Web -->
  <rect x="667" y="180" width="15" height="150" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>
  <!-- Top flange -->
  <rect x="615" y="165" width="120" height="15" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>

  <!-- Osi -->
  <line x1="580" y1="253" x2="770" y2="253" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="674" y1="145" x2="674" y2="365" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="572" y="256" font-size="10" fill="#dc2626">z</text>
  <text x="676" y="142" font-size="10" fill="#16a34a">y</text>

  <!-- Mere: B=8cm -->
  <line x1="615" y1="358" x2="735" y2="358" stroke="#555" stroke-width="1"/>
  <line x1="615" y1="353" x2="615" y2="363" stroke="#555" stroke-width="1.5"/>
  <line x1="735" y1="353" x2="735" y2="363" stroke="#555" stroke-width="1.5"/>
  <text x="675" y="374" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">B = 8 cm</text>

  <!-- Mere: H=12cm -->
  <line x1="750" y1="165" x2="750" y2="345" stroke="#555" stroke-width="1"/>
  <line x1="745" y1="165" x2="755" y2="165" stroke="#555" stroke-width="1.5"/>
  <line x1="745" y1="345" x2="755" y2="345" stroke="#555" stroke-width="1.5"/>
  <text x="770" y="260" font-size="12" fill="#555" font-weight="bold">H=12</text>
  <text x="770" y="275" font-size="12" fill="#555">cm</text>

  <!-- Mere: tf=1cm -->
  <line x1="597" y1="165" x2="597" y2="180" stroke="#555" stroke-width="1"/>
  <line x1="592" y1="165" x2="602" y2="165" stroke="#555" stroke-width="1.5"/>
  <line x1="592" y1="180" x2="602" y2="180" stroke="#555" stroke-width="1.5"/>
  <text x="557" y="175" font-size="11" fill="#555">t_f=1</text>

  <!-- hw=10cm oznaka -->
  <line x1="597" y1="180" x2="597" y2="330" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="592" y1="180" x2="602" y2="180" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="592" y1="330" x2="602" y2="330" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="550" y="260" font-size="11" fill="#7c3aed">h_w</text>
  <text x="547" y="274" font-size="11" fill="#7c3aed">=10 cm</text>

  <!-- ===== SPODAJ: enačba ravnotežja in rezultat ===== -->
  <line x1="20" y1="415" x2="800" y2="415" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="30" y="425" width="760" height="44" fill="#fefce8" rx="6" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="410" y="443" text-anchor="middle" font-size="12" fill="#92400e" font-weight="bold">Ravnotežje: N₁ = S√2  |  F_dop = π²·E·I_min / (l_u²·ν) = 33,1 kN</text>
  <text x="410" y="462" text-anchor="middle" font-size="13" fill="#1e40af" font-weight="bold">S_dop = F_dop / √2 = 33,1 / 1,414 = 23,4 kN</text>
</svg>
