<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
<text x="380" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">NALOGA 5 — Čisto strižno stanje (d=60 mm) + primerjava Tresca/VM</text>

<!-- LEFT: Mohr circle for pure shear -->
<!-- σ1=+47.16, σ2=0, σ3=-47.16 MPa -->
<!-- Center at origin! C=(0,0) in stress space. R=47.16 MPa -->
<!-- Origin at (240, 230). Scale: 3 px/MPa -->
<!-- σ1=+47.16 → x=240+47.16*3=381; σ3=-47.16 → x=240-47.16*3=99 -->
<!-- R → 141 px. Top at y=230-141=89 -->

<text x="240" y="50" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">Mohrova krožnica — čisto strižno stanje</text>

<!-- Axes (origin=240,230) -->
<line x1="60" y1="230" x2="440" y2="230" stroke="#333" stroke-width="1.5"/>
<polygon points="436,225 446,230 436,235" fill="#333"/>
<text x="450" y="234" font-size="11" fill="#333">σ</text>

<line x1="240" y1="60" x2="240" y2="400" stroke="#333" stroke-width="1.5"/>
<polygon points="235,64 240,54 245,64" fill="#333"/>
<text x="215" y="56" font-size="11" fill="#333">τ</text>

<!-- Grid marks -->
<g font-size="9" fill="#888" text-anchor="middle">
  <line x1="99" y1="226" x2="99" y2="234" stroke="#aaa"/> <text x="99" y="244">−47</text>
  <line x1="170" y1="226" x2="170" y2="234" stroke="#aaa"/> <text x="170" y="244">−23</text>
  <line x1="310" y1="226" x2="310" y2="234" stroke="#aaa"/> <text x="310" y="244">+23</text>
  <line x1="381" y1="226" x2="381" y2="234" stroke="#aaa"/> <text x="381" y="244">+47</text>
</g>
<g font-size="9" fill="#888" text-anchor="end">
  <line x1="236" y1="89" x2="244" y2="89" stroke="#aaa"/> <text x="234" y="92">+47</text>
  <line x1="236" y1="160" x2="244" y2="160" stroke="#aaa"/> <text x="234" y="163">+23</text>
  <line x1="236" y1="300" x2="244" y2="300" stroke="#aaa"/> <text x="234" y="303">−23</text>
  <line x1="236" y1="371" x2="244" y2="371" stroke="#aaa"/> <text x="234" y="374">−47</text>
</g>

<!-- Pure shear Mohr circle: center=(240,230), R=141 -->
<circle cx="240" cy="230" r="141" fill="rgba(100,100,255,0.07)" stroke="#336699" stroke-width="2.5"/>

<!-- Center at origin -->
<circle cx="240" cy="230" r="5" fill="#336699"/>
<text x="248" y="222" font-size="10" fill="#336699" font-weight="bold">C(0,0)</text>

<!-- Point A (τ=47.16): σx=0, τxy=47.16 → (240, 371) -->
<circle cx="240" cy="371" r="5" fill="#cc0000"/>
<text x="250" y="378" font-size="10" fill="#cc0000" font-weight="bold">A(0; +47,16)</text>
<text x="250" y="390" font-size="9" fill="#cc0000">x-ploskev</text>

<!-- Point B: (0, -47.16) → (240, 89) -->
<circle cx="240" cy="89" r="5" fill="#006600"/>
<text x="250" y="86" font-size="10" fill="#006600" font-weight="bold">B(0; −47,16)</text>

<!-- Diameter line (vertical) -->
<line x1="240" y1="371" x2="240" y2="89" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>

<!-- σ1 = +47.16 → x=381 -->
<circle cx="381" cy="230" r="5" fill="#cc0000"/>
<text x="381" y="217" text-anchor="middle" font-size="11" fill="#cc0000" font-weight="bold">σ₁=+47,16</text>

<!-- σ3 = -47.16 → x=99 -->
<circle cx="99" cy="230" r="5" fill="#006600"/>
<text x="99" y="217" text-anchor="middle" font-size="11" fill="#006600" font-weight="bold">σ₃=−47,16</text>

<!-- σ2 = 0 already at center -->
<text x="240" y="255" text-anchor="middle" font-size="10" fill="#8B4500">σ₂=0</text>

<!-- φ₀ = 45° annotation -->
<path d="M 285,230 A 45,45 0 0 1 272,262" fill="none" stroke="#cc0000" stroke-width="2"/>
<text x="296" y="256" font-size="10" fill="#cc0000" font-weight="bold">2φ₀=90°</text>
<text x="296" y="268" font-size="10" fill="#cc0000">φ₀=45° !</text>

<!-- Key insight box -->
<rect x="60" y="415" width="360" height="55" rx="5" fill="#fffbe6" stroke="#cc9900" stroke-width="1.5"/>
<text x="240" y="432" text-anchor="middle" font-size="10" font-weight="bold" fill="#885500">Ključno: Čisto strižno stanje</text>
<text x="68" y="447" font-size="9" fill="#333">σ₁ = +τ = +47,16 MPa, σ₃ = −τ = −47,16 MPa, σ₂ = 0</text>
<text x="68" y="460" font-size="9" fill="#333">Ravnina max napetosti je vedno pod 45° glede na ravnino strižne napetosti!</text>

<!-- ============ RIGHT SIDE: Tresca vs Von Mises comparison ============ -->

<text x="600" y="50" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">Tresca vs. Von Mises</text>

<!-- Formula derivation for pure shear -->
<rect x="465" y="65" width="275" height="120" rx="5" fill="#f0f4ff" stroke="#336699" stroke-width="1.5"/>
<text x="602" y="82" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Izpeljava iz σ₁,σ₃ (čisto strig)</text>
<text x="473" y="98" font-size="10" fill="#336699">Tresca: σekv = σ₁−σ₃ = 2τ</text>
<text x="473" y="113" font-size="10" fill="#336699">       = 2 × 47,16</text>
<text x="473" y="128" font-size="13" fill="#cc0000" font-weight="bold">       = 94,32 MPa</text>
<text x="473" y="148" font-size="10" fill="#cc6600">Von Mises: σekv = τ√3</text>
<text x="473" y="163" font-size="10" fill="#cc6600">          = 47,16 × 1,732</text>
<text x="473" y="178" font-size="13" fill="#cc6600" font-weight="bold">          = 81,65 MPa</text>

<!-- Bar chart comparison -->
<text x="602" y="218" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Grafična primerjava</text>

<!-- Bar for Tresca (height proportional: 94.32 → 189 px at 2px/MPa) -->
<rect x="510" y="224" width="60" height="189" fill="rgba(200,0,0,0.2)" stroke="#cc0000" stroke-width="2"/>
<!-- Normalize to fit: scale 1.8 px/MPa. 94.32→170px; 81.65→147px -->
<rect x="510" y="227" width="60" height="170" fill="rgba(200,0,0,0.25)" stroke="#cc0000" stroke-width="2"/>
<text x="540" y="222" text-anchor="middle" font-size="10" fill="#cc0000" font-weight="bold">Tresca</text>
<text x="540" y="407" text-anchor="middle" font-size="11" fill="#cc0000" font-weight="bold">94,32</text>

<rect x="610" y="253" width="60" height="147" fill="rgba(200,100,0,0.25)" stroke="#cc6600" stroke-width="2"/>
<text x="640" y="247" text-anchor="middle" font-size="10" fill="#cc6600" font-weight="bold">Von Mises</text>
<text x="640" y="410" text-anchor="middle" font-size="11" fill="#cc6600" font-weight="bold">81,65</text>

<!-- σdop line for Material A (100 MPa) -->
<line x1="500" y1="407" x2="690" y2="407" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3"/>

<!-- σdop line for Material B (90 MPa) -->
<!-- 90 MPa from bottom: 90*1.8=162px → y=400-162=238... let's draw relative to bars -->
<!-- Bars start at y=397(0MPa). 90MPa→y=397-162=235; 94MPa line at y=397-170=227 -->
<line x1="500" y1="235" x2="690" y2="235" stroke="#cc0000" stroke-width="2" stroke-dasharray="3,2"/>
<text x="692" y="230" font-size="9" fill="#cc0000">σdop=90 MPa</text>
<text x="692" y="402" font-size="9" fill="#555">σdop=100 MPa</text>

<!-- Annotation: Tresca fails at 90 MPa limit -->
<text x="540" y="275" text-anchor="middle" font-size="10" fill="#cc0000" font-weight="bold">PREKORAČENO!</text>
<text x="540" y="287" text-anchor="middle" font-size="9" fill="#cc0000">94>90 MPa ✗</text>

<text x="640" y="350" text-anchor="middle" font-size="10" fill="#006600" font-weight="bold">varno ✓</text>
<text x="640" y="362" text-anchor="middle" font-size="9" fill="#006600">81&lt;90 MPa</text>

<!-- Design table -->
<rect x="465" y="420" width="275" height="65" rx="5" fill="#e8f4e8" stroke="#006600" stroke-width="1.5"/>
<text x="602" y="437" text-anchor="middle" font-size="10" font-weight="bold" fill="#005500">Varnost (σdop=90 MPa)</text>
<text x="473" y="452" font-size="9" fill="#333">Tresca: 94,32 &gt; 90 MPa → ✗ NEVARNO</text>
<text x="473" y="465" font-size="9" fill="#333">VM:     81,65 &lt; 90 MPa → ✓ VARNO</text>
<text x="473" y="478" font-size="9" fill="#885500">Razlika: 15,5% → kritično pri mejnih σdop!</text>
</svg>
