<svg viewBox="0 0 860 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <rect width="860" height="620" fill="#1a1a2e" rx="12"/>
  <text x="430" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#e0e0e0">M-diagram — tipični primeri</text>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- ROW 1 LEFT: Prostoležeč, enakomerna obtežba q -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <rect x="15" y="50" width="400" height="170" rx="8" fill="#0d1b2a" stroke="#2196F3" stroke-width="1.2"/>
  <text x="215" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#2196F3">Prostoležeč + enakomerna obtežba q</text>

  <!-- q arrows -->
  <g stroke="#FF9800" fill="#FF9800">
    <line x1="60" y1="85" x2="60" y2="100" stroke-width="1.5"/>  <polygon points="60,103 57,96 63,96"/>
    <line x1="95" y1="85" x2="95" y2="100" stroke-width="1.5"/>  <polygon points="95,103 92,96 98,96"/>
    <line x1="130" y1="85" x2="130" y2="100" stroke-width="1.5"/> <polygon points="130,103 127,96 133,96"/>
    <line x1="165" y1="85" x2="165" y2="100" stroke-width="1.5"/> <polygon points="165,103 162,96 168,96"/>
    <line x1="200" y1="85" x2="200" y2="100" stroke-width="1.5"/> <polygon points="200,103 197,96 203,96"/>
    <line x1="235" y1="85" x2="235" y2="100" stroke-width="1.5"/> <polygon points="235,103 232,96 238,96"/>
    <line x1="270" y1="85" x2="270" y2="100" stroke-width="1.5"/> <polygon points="270,103 267,96 273,96"/>
    <line x1="305" y1="85" x2="305" y2="100" stroke-width="1.5"/> <polygon points="305,103 302,96 308,96"/>
    <line x1="340" y1="85" x2="340" y2="100" stroke-width="1.5"/> <polygon points="340,103 337,96 343,96"/>
  </g>
  <line x1="50" y1="85" x2="350" y2="85" stroke="#FF9800" stroke-width="1.5"/>
  <text x="205" y="82" text-anchor="middle" font-size="10" fill="#FF9800">q [kN/m]</text>

  <!-- Beam -->
  <line x1="50" y1="105" x2="350" y2="105" stroke="#FFD700" stroke-width="5"/>
  <!-- Supports -->
  <polygon points="50,105 40,122 60,122" fill="#90CAF9"/>
  <line x1="32" y1="125" x2="68" y2="125" stroke="#90CAF9" stroke-width="2"/>
  <polygon points="350,105 340,122 360,122" fill="#90CAF9"/>
  <line x1="332" y1="125" x2="368" y2="125" stroke="#90CAF9" stroke-width="2"/>
  <text x="44" y="138" font-size="10" fill="#90CAF9">A</text>
  <text x="352" y="138" font-size="10" fill="#90CAF9">B</text>
  <text x="190" y="148" font-size="10" fill="#aaa">L</text>
  <line x1="50" y1="145" x2="170" y2="145" stroke="#aaa" stroke-width="1"/>
  <line x1="230" y1="145" x2="350" y2="145" stroke="#aaa" stroke-width="1"/>

  <!-- M diagram (parabola, positive -> drawn below beam axis) -->
  <line x1="50" y1="155" x2="350" y2="155" stroke="#555" stroke-width="1"/>
  <path d="M 50 155 Q 200 200 350 155" stroke="#4FC3F7" stroke-width="2.5" fill="#4FC3F7" fill-opacity="0.18"/>
  <line x1="50" y1="155" x2="350" y2="155" stroke="#4FC3F7" stroke-width="1.5"/>

  <!-- Max label -->
  <line x1="200" y1="202" x2="200" y2="155" stroke="#4FC3F7" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="200" y="213" text-anchor="middle" font-size="11" font-weight="bold" fill="#4FC3F7">M_max = qL²/8</text>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- ROW 1 RIGHT: Prostoležeč + točkovna sila F na sredini -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <rect x="445" y="50" width="400" height="170" rx="8" fill="#0d1b2a" stroke="#2196F3" stroke-width="1.2"/>
  <text x="645" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#2196F3">Prostoležeč + sila F na sredini</text>

  <!-- F arrow -->
  <line x1="645" y1="82" x2="645" y2="100" stroke="#FF9800" stroke-width="2"/>
  <polygon points="645,103 641,95 649,95" fill="#FF9800"/>
  <text x="645" y="79" text-anchor="middle" font-size="11" fill="#FF9800">F</text>

  <!-- Beam -->
  <line x1="480" y1="105" x2="810" y2="105" stroke="#FFD700" stroke-width="5"/>
  <polygon points="480,105 470,122 490,122" fill="#90CAF9"/>
  <line x1="462" y1="125" x2="498" y2="125" stroke="#90CAF9" stroke-width="2"/>
  <polygon points="810,105 800,122 820,122" fill="#90CAF9"/>
  <line x1="792" y1="125" x2="828" y2="125" stroke="#90CAF9" stroke-width="2"/>
  <text x="474" y="138" font-size="10" fill="#90CAF9">A</text>
  <text x="812" y="138" font-size="10" fill="#90CAF9">B</text>

  <!-- M diagram (triangle, max at F) -->
  <line x1="480" y1="155" x2="810" y2="155" stroke="#555" stroke-width="1"/>
  <polygon points="480,155 645,205 810,155" stroke="#4FC3F7" stroke-width="2.5" fill="#4FC3F7" fill-opacity="0.18"/>

  <!-- Max label -->
  <line x1="645" y1="207" x2="645" y2="155" stroke="#4FC3F7" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="645" y="217" text-anchor="middle" font-size="11" font-weight="bold" fill="#4FC3F7">M_max = FL/4</text>
  <text x="645" y="144" text-anchor="middle" font-size="10" fill="#aaa">L/2</text>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- ROW 2 LEFT: Konzola + enakomerna obtežba -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <rect x="15" y="240" width="400" height="180" rx="8" fill="#0d1b2a" stroke="#F44336" stroke-width="1.2"/>
  <text x="215" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#F44336">Konzola + enakomerna obtežba q</text>

  <!-- q arrows -->
  <g stroke="#FF9800" fill="#FF9800">
    <line x1="100" y1="274" x2="100" y2="289" stroke-width="1.5"/> <polygon points="100,292 97,285 103,285"/>
    <line x1="135" y1="274" x2="135" y2="289" stroke-width="1.5"/> <polygon points="135,292 132,285 138,285"/>
    <line x1="170" y1="274" x2="170" y2="289" stroke-width="1.5"/> <polygon points="170,292 167,285 173,285"/>
    <line x1="205" y1="274" x2="205" y2="289" stroke-width="1.5"/> <polygon points="205,292 202,285 208,285"/>
    <line x1="240" y1="274" x2="240" y2="289" stroke-width="1.5"/> <polygon points="240,292 237,285 243,285"/>
    <line x1="275" y1="274" x2="275" y2="289" stroke-width="1.5"/> <polygon points="275,292 272,285 278,285"/>
    <line x1="310" y1="274" x2="310" y2="289" stroke-width="1.5"/> <polygon points="310,292 307,285 313,285"/>
  </g>
  <line x1="95" y1="274" x2="315" y2="274" stroke="#FF9800" stroke-width="1.5"/>

  <!-- Wall (left) -->
  <rect x="55" y="280" width="25" height="60" fill="#555" stroke="#888" stroke-width="1"/>
  <line x1="55" y1="285" x2="70" y2="280" stroke="#888" stroke-width="1"/>
  <line x1="55" y1="295" x2="70" y2="290" stroke="#888" stroke-width="1"/>
  <line x1="55" y1="305" x2="70" y2="300" stroke="#888" stroke-width="1"/>
  <line x1="55" y1="315" x2="70" y2="310" stroke="#888" stroke-width="1"/>
  <line x1="55" y1="325" x2="70" y2="320" stroke="#888" stroke-width="1"/>
  <line x1="55" y1="335" x2="70" y2="330" stroke="#888" stroke-width="1"/>

  <!-- Beam -->
  <line x1="80" y1="295" x2="340" y2="295" stroke="#FFD700" stroke-width="5"/>

  <!-- M diagram (parabola, negative -> drawn ABOVE beam axis, red) -->
  <line x1="80" y1="315" x2="340" y2="315" stroke="#555" stroke-width="1"/>
  <path d="M 80 315 Q 80 360 340 315" stroke="#F44336" stroke-width="2.5" fill="#F44336" fill-opacity="0.18"/>
  <!-- Actually for konzola with q, the M diagram is parabolic, max at fixed end -->
  <!-- Draw correctly: max at LEFT (wall), zero at right (free end) -->
  <path d="M 80 315 Q 200 375 340 315" stroke="none" fill="none"/>
  <!-- Redo: konzola. Fixed at left. Zero at right. Parabolic negative moment.
       M(x) = -q(L-x)²/2  where x goes from 0 (free end, right) to L (fixed, left)
       So max at fixed end (left). M diagram above the line. -->
  <path d="M 80 315 Q 80 375 340 315" stroke="#F44336" stroke-width="2.5" fill="#F44336" fill-opacity="0.22"/>
  <line x1="80" y1="315" x2="340" y2="315" stroke="#F44336" stroke-width="1.5"/>

  <!-- Max label -->
  <text x="85" y="388" font-size="11" font-weight="bold" fill="#F44336">M_max = qL²/2</text>
  <text x="160" y="327" font-size="10" fill="#aaa">(negativen → diagram nad osjo)</text>
  <line x1="80" y1="315" x2="80" y2="376" stroke="#F44336" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Labels -->
  <text x="80" y="307" text-anchor="middle" font-size="10" fill="#aaa">vpetje</text>
  <text x="340" y="307" text-anchor="middle" font-size="10" fill="#aaa">prosti konec</text>
  <text x="350" y="320" font-size="10" fill="#aaa">M=0</text>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- ROW 2 RIGHT: Konzola + točkovna sila F -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <rect x="445" y="240" width="400" height="180" rx="8" fill="#0d1b2a" stroke="#F44336" stroke-width="1.2"/>
  <text x="645" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#F44336">Konzola + točkovna sila F</text>

  <!-- F arrow at free end -->
  <line x1="810" y1="268" x2="810" y2="286" stroke="#FF9800" stroke-width="2"/>
  <polygon points="810,289 806,281 814,281" fill="#FF9800"/>
  <text x="810" y="265" text-anchor="middle" font-size="11" fill="#FF9800">F</text>

  <!-- Wall (left) -->
  <rect x="460" y="275" width="25" height="60" fill="#555" stroke="#888" stroke-width="1"/>
  <line x1="460" y1="280" x2="475" y2="275" stroke="#888" stroke-width="1"/>
  <line x1="460" y1="290" x2="475" y2="285" stroke="#888" stroke-width="1"/>
  <line x1="460" y1="300" x2="475" y2="295" stroke="#888" stroke-width="1"/>
  <line x1="460" y1="310" x2="475" y2="305" stroke="#888" stroke-width="1"/>
  <line x1="460" y1="320" x2="475" y2="315" stroke="#888" stroke-width="1"/>
  <line x1="460" y1="330" x2="475" y2="325" stroke="#888" stroke-width="1"/>

  <!-- Beam -->
  <line x1="485" y1="292" x2="810" y2="292" stroke="#FFD700" stroke-width="5"/>

  <!-- M diagram (triangle, negative) -->
  <line x1="485" y1="312" x2="810" y2="312" stroke="#555" stroke-width="1"/>
  <polygon points="485,312 485,380 810,312" stroke="#F44336" stroke-width="2.5" fill="#F44336" fill-opacity="0.22"/>
  <line x1="485" y1="312" x2="810" y2="312" stroke="#F44336" stroke-width="1.5"/>

  <!-- Max label -->
  <text x="500" y="393" font-size="11" font-weight="bold" fill="#F44336">M_max = F·L</text>
  <text x="810" y="325" font-size="10" fill="#aaa">M=0</text>
  <line x1="485" y1="312" x2="485" y2="381" stroke="#F44336" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Labels -->
  <text x="485" y="304" text-anchor="middle" font-size="10" fill="#aaa">vpetje</text>
  <text x="810" y="304" text-anchor="middle" font-size="10" fill="#aaa">prosti konec</text>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- ROW 3: Previsni nosilci (kombinirano) -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <rect x="15" y="438" width="830" height="168" rx="8" fill="#0d1b2a" stroke="#9C27B0" stroke-width="1.2"/>
  <text x="430" y="458" text-anchor="middle" font-size="12" font-weight="bold" fill="#CE93D8">Previsni nosilci — kombiniran M diagram (neg. pri podpori, poz. v polju)</text>

  <!-- Beam setup: F on previs (left of A), q in field A-B -->
  <!-- Beam line -->
  <line x1="90" y1="498" x2="620" y2="498" stroke="#FFD700" stroke-width="5"/>

  <!-- F on previs -->
  <line x1="90" y1="472" x2="90" y2="492" stroke="#FF9800" stroke-width="2"/>
  <polygon points="90,495 86,487 94,487" fill="#FF9800"/>
  <text x="90" y="469" text-anchor="middle" font-size="11" fill="#FF9800">F</text>

  <!-- q in field -->
  <g stroke="#4FC3F7" fill="#4FC3F7">
    <line x1="250" y1="475" x2="250" y2="490" stroke-width="1.5"/> <polygon points="250,493 247,486 253,486"/>
    <line x1="300" y1="475" x2="300" y2="490" stroke-width="1.5"/> <polygon points="300,493 297,486 303,486"/>
    <line x1="350" y1="475" x2="350" y2="490" stroke-width="1.5"/> <polygon points="350,493 347,486 353,486"/>
    <line x1="400" y1="475" x2="400" y2="490" stroke-width="1.5"/> <polygon points="400,493 397,486 403,486"/>
    <line x1="450" y1="475" x2="450" y2="490" stroke-width="1.5"/> <polygon points="450,493 447,486 453,486"/>
    <line x1="500" y1="475" x2="500" y2="490" stroke-width="1.5"/> <polygon points="500,493 497,486 503,486"/>
    <line x1="550" y1="475" x2="550" y2="490" stroke-width="1.5"/> <polygon points="550,493 547,486 553,486"/>
  </g>
  <line x1="240" y1="475" x2="560" y2="475" stroke="#4FC3F7" stroke-width="1.5"/>
  <text x="400" y="472" text-anchor="middle" font-size="10" fill="#4FC3F7">q</text>

  <!-- Support A -->
  <polygon points="230,498 220,515 240,515" fill="#90CAF9"/>
  <line x1="212" y1="518" x2="248" y2="518" stroke="#90CAF9" stroke-width="2"/>
  <text x="230" y="530" text-anchor="middle" font-size="11" fill="#90CAF9">A</text>

  <!-- Support B -->
  <polygon points="620,498 610,515 630,515" fill="#90CAF9"/>
  <line x1="602" y1="518" x2="638" y2="518" stroke="#90CAF9" stroke-width="2"/>
  <text x="620" y="530" text-anchor="middle" font-size="11" fill="#90CAF9">B</text>

  <!-- Previs label -->
  <line x1="90" y1="538" x2="230" y2="538" stroke="#aaa" stroke-width="1"/>
  <text x="160" y="548" text-anchor="middle" font-size="10" fill="#aaa">previs a</text>

  <!-- M diagram baseline -->
  <line x1="90" y1="560" x2="620" y2="560" stroke="#555" stroke-width="1"/>

  <!-- M at previs: negative (above line) from free end to A -->
  <!-- M goes from 0 at free end to -Fa at A -->
  <polygon points="90,560 230,540 230,560" stroke="#F44336" stroke-width="2" fill="#F44336" fill-opacity="0.25"/>

  <!-- M in field: parabola positive (below line) from A to B -->
  <path d="M 230 560 Q 420 595 620 560" stroke="#4FC3F7" stroke-width="2.5" fill="#4FC3F7" fill-opacity="0.2"/>
  <line x1="230" y1="560" x2="620" y2="560" stroke="none"/>

  <!-- Labels on diagram -->
  <text x="145" y="537" text-anchor="middle" font-size="10" fill="#F44336">neg.</text>
  <text x="235" y="555" font-size="10" fill="#F44336">M_A = −F·a</text>
  <text x="420" y="598" text-anchor="middle" font-size="10" fill="#4FC3F7">M_max (polje)</text>
  <text x="90" y="555" text-anchor="middle" font-size="10" fill="#aaa">0</text>
  <text x="620" y="555" text-anchor="middle" font-size="10" fill="#aaa">0</text>

  <!-- Zero crossing marker -->
  <line x1="320" y1="550" x2="320" y2="570" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="320" y="580" text-anchor="middle" font-size="9" fill="#FFD700">M=0 (inf. točka)</text>

  <!-- Right side labels -->
  <text x="680" y="475" font-size="11" fill="#CE93D8">Pravilo:</text>
  <text x="680" y="492" font-size="10" fill="#F44336">▸ Neg. M → diagram</text>
  <text x="688" y="506" font-size="10" fill="#F44336">  nad os</text>
  <text x="680" y="522" font-size="10" fill="#4FC3F7">▸ Poz. M → diagram</text>
  <text x="688" y="536" font-size="10" fill="#4FC3F7">  pod os</text>
  <text x="680" y="555" font-size="10" fill="#FFD700">▸ Infleksijska točka</text>
  <text x="688" y="569" font-size="10" fill="#FFD700">  = M prehod skozi 0</text>
  <text x="680" y="585" font-size="10" fill="#CE93D8">▸ Pod q → parabola</text>
  <text x="680" y="599" font-size="10" fill="#CE93D8">▸ Pod F → trikotnik</text>

</svg>
