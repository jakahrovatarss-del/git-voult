<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="800" height="520" fill="#1a1a2e" rx="12"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#e0e0e0">Predznak upogibnega momenta</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- LEFT PANEL: POZITIVEN M (SAGGING) -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="20" y="55" width="365" height="440" rx="8" fill="#0d1b2a" stroke="#2196F3" stroke-width="1.5"/>

  <!-- Panel title -->
  <rect x="80" y="65" width="245" height="30" rx="6" fill="#1565C0"/>
  <text x="202" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="white">M &gt; 0  (pozitiven, "sagging")</text>

  <!-- Loads (arrows pointing down) -->
  <g fill="#FF9800" stroke="#FF9800">
    <line x1="110" y1="120" x2="110" y2="145" stroke-width="2"/>
    <polygon points="110,148 106,140 114,140"/>
    <line x1="160" y1="120" x2="160" y2="145" stroke-width="2"/>
    <polygon points="160,148 156,140 164,140"/>
    <line x1="210" y1="120" x2="210" y2="145" stroke-width="2"/>
    <polygon points="210,148 206,140 214,140"/>
    <line x1="260" y1="120" x2="260" y2="145" stroke-width="2"/>
    <polygon points="260,148 256,140 264,140"/>
    <line x1="310" y1="120" x2="310" y2="145" stroke-width="2"/>
    <polygon points="310,148 306,140 314,140"/>
  </g>
  <text x="210" y="114" text-anchor="middle" font-size="11" fill="#FF9800">q ali F</text>

  <!-- Curved beam (sagging - curves downward like a smile) -->
  <path d="M 80 168 Q 210 215 340 168" stroke="#FFD700" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Supports -->
  <!-- Left support (pin) -->
  <polygon points="80,168 68,188 92,188" fill="#90CAF9" stroke="#90CAF9" stroke-width="1"/>
  <line x1="60" y1="192" x2="100" y2="192" stroke="#90CAF9" stroke-width="2"/>
  <!-- Right support (pin) -->
  <polygon points="340,168 328,188 352,188" fill="#90CAF9" stroke="#90CAF9" stroke-width="1"/>
  <line x1="320" y1="192" x2="360" y2="192" stroke="#90CAF9" stroke-width="2"/>

  <!-- Reaction arrows (up) -->
  <line x1="80" y1="205" x2="80" y2="188" stroke="#90CAF9" stroke-width="2"/>
  <polygon points="80,185 76,195 84,195" fill="#90CAF9"/>
  <text x="65" y="220" font-size="11" fill="#90CAF9">R_A</text>

  <line x1="340" y1="205" x2="340" y2="188" stroke="#90CAF9" stroke-width="2"/>
  <polygon points="340,185 336,195 344,195" fill="#90CAF9"/>
  <text x="330" y="220" font-size="11" fill="#90CAF9">R_B</text>

  <!-- Separator line -->
  <line x1="40" y1="238" x2="368" y2="238" stroke="#333" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Cross-section label -->
  <text x="202" y="258" text-anchor="middle" font-size="12" fill="#aaa">Prerez v sredini (max M):</text>

  <!-- Cross-section rectangle -->
  <rect x="167" y="268" width="70" height="100" rx="3" fill="none" stroke="#FFD700" stroke-width="2"/>

  <!-- Neutral axis -->
  <line x1="155" y1="318" x2="250" y2="318" stroke="#00E5FF" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="253" y="322" font-size="11" fill="#00E5FF">NO</text>

  <!-- Compression zone (top) - red/orange -->
  <rect x="167" y="268" width="70" height="50" rx="3" fill="#F44336" fill-opacity="0.35"/>
  <text x="202" y="297" text-anchor="middle" font-size="13" font-weight="bold" fill="#F44336">TLAK</text>
  <text x="202" y="311" text-anchor="middle" font-size="11" fill="#F44336">(−)</text>

  <!-- Tension zone (bottom) - blue -->
  <rect x="167" y="318" width="70" height="50" rx="3" fill="#2196F3" fill-opacity="0.35"/>
  <text x="202" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#4FC3F7">NATEG</text>
  <text x="202" y="356" text-anchor="middle" font-size="11" fill="#4FC3F7">(+)</text>

  <!-- Stress distribution (triangular) -->
  <!-- Top fiber compression -->
  <line x1="140" y1="268" x2="164" y2="318" stroke="#F44336" stroke-width="1.5"/>
  <line x1="140" y1="268" x2="140" y2="318" stroke="#F44336" stroke-width="1.5"/>
  <polygon points="138,270 142,270 140,268" fill="#F44336"/>
  <text x="118" y="275" font-size="10" fill="#F44336">σ_max</text>

  <!-- Bottom fiber tension -->
  <line x1="140" y1="368" x2="164" y2="318" stroke="#4FC3F7" stroke-width="1.5"/>
  <line x1="140" y1="368" x2="140" y2="318" stroke="#4FC3F7" stroke-width="1.5"/>
  <polygon points="138,366 142,366 140,368" fill="#4FC3F7"/>
  <text x="118" y="373" font-size="10" fill="#4FC3F7">σ_max</text>

  <!-- Summary box -->
  <rect x="35" y="400" width="335" height="80" rx="6" fill="#0a2540" stroke="#2196F3" stroke-width="1"/>
  <text x="202" y="420" text-anchor="middle" font-size="12" font-weight="bold" fill="#2196F3">Spodnja vlakna: NATEG (+)</text>
  <text x="202" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#F44336">Zgornja vlakna: TLAK (−)</text>
  <text x="202" y="460" text-anchor="middle" font-size="11" fill="#aaa">Nosilci se "nasmeje" navzdol ⌣</text>
  <text x="202" y="476" text-anchor="middle" font-size="11" fill="#777">M diagram narišemo POD os</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- RIGHT PANEL: NEGATIVEN M (HOGGING) -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="415" y="55" width="365" height="440" rx="8" fill="#0d1b2a" stroke="#F44336" stroke-width="1.5"/>

  <!-- Panel title -->
  <rect x="475" y="65" width="245" height="30" rx="6" fill="#C62828"/>
  <text x="597" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="white">M &lt; 0  (negativen, "hogging")</text>

  <!-- Loads pointing up (upward distributed or reaction) -->
  <!-- Downward load on cantilever end -->
  <g fill="#FF9800" stroke="#FF9800">
    <line x1="605" y1="120" x2="605" y2="145" stroke-width="2"/>
    <polygon points="605,148 601,140 609,140"/>
  </g>
  <text x="605" y="114" text-anchor="middle" font-size="11" fill="#FF9800">F</text>

  <!-- Curved beam (hogging - curves upward like a frown) -->
  <!-- Cantilever/overhang shape: M negative at support -->
  <path d="M 475 180 Q 530 170 605 180" stroke="#FFD700" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Hinge/support at left -->
  <line x1="475" y1="160" x2="475" y2="200" stroke="#FFD700" stroke-width="8"/>

  <!-- Wall/fixed support (left) -->
  <rect x="445" y="150" width="30" height="60" fill="#555" stroke="#999" stroke-width="1"/>
  <!-- Hatch lines for wall -->
  <line x1="445" y1="155" x2="460" y2="150" stroke="#999" stroke-width="1"/>
  <line x1="445" y1="165" x2="460" y2="160" stroke="#999" stroke-width="1"/>
  <line x1="445" y1="175" x2="460" y2="170" stroke="#999" stroke-width="1"/>
  <line x1="445" y1="185" x2="460" y2="180" stroke="#999" stroke-width="1"/>
  <line x1="445" y1="195" x2="460" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="445" y1="205" x2="460" y2="200" stroke="#999" stroke-width="1"/>

  <!-- Free end reaction arrow label -->
  <text x="620" y="220" font-size="11" fill="#90CAF9">konec</text>

  <!-- Separator line -->
  <line x1="435" y1="238" x2="763" y2="238" stroke="#333" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Cross-section label -->
  <text x="597" y="258" text-anchor="middle" font-size="12" fill="#aaa">Prerez pri vpetju (max |M|):</text>

  <!-- Cross-section rectangle -->
  <rect x="562" y="268" width="70" height="100" rx="3" fill="none" stroke="#FFD700" stroke-width="2"/>

  <!-- Neutral axis -->
  <line x1="550" y1="318" x2="645" y2="318" stroke="#00E5FF" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="648" y="322" font-size="11" fill="#00E5FF">NO</text>

  <!-- Tension zone (top) - blue (hogging: top is in tension!) -->
  <rect x="562" y="268" width="70" height="50" rx="3" fill="#2196F3" fill-opacity="0.35"/>
  <text x="597" y="297" text-anchor="middle" font-size="13" font-weight="bold" fill="#4FC3F7">NATEG</text>
  <text x="597" y="311" text-anchor="middle" font-size="11" fill="#4FC3F7">(+)</text>

  <!-- Compression zone (bottom) - red -->
  <rect x="562" y="318" width="70" height="50" rx="3" fill="#F44336" fill-opacity="0.35"/>
  <text x="597" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#F44336">TLAK</text>
  <text x="597" y="356" text-anchor="middle" font-size="11" fill="#F44336">(−)</text>

  <!-- Stress distribution (triangular) - mirrored -->
  <!-- Top fiber tension -->
  <line x1="535" y1="268" x2="559" y2="318" stroke="#4FC3F7" stroke-width="1.5"/>
  <line x1="535" y1="268" x2="535" y2="318" stroke="#4FC3F7" stroke-width="1.5"/>
  <polygon points="533,270 537,270 535,268" fill="#4FC3F7"/>
  <text x="513" y="275" font-size="10" fill="#4FC3F7">σ_max</text>

  <!-- Bottom fiber compression -->
  <line x1="535" y1="368" x2="559" y2="318" stroke="#F44336" stroke-width="1.5"/>
  <line x1="535" y1="368" x2="535" y2="318" stroke="#F44336" stroke-width="1.5"/>
  <polygon points="533,366 537,366 535,368" fill="#F44336"/>
  <text x="513" y="373" font-size="10" fill="#F44336">σ_max</text>

  <!-- Summary box -->
  <rect x="430" y="400" width="335" height="80" rx="6" fill="#2a0a0a" stroke="#F44336" stroke-width="1"/>
  <text x="597" y="420" text-anchor="middle" font-size="12" font-weight="bold" fill="#4FC3F7">Zgornja vlakna: NATEG (+)</text>
  <text x="597" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#F44336">Spodnja vlakna: TLAK (−)</text>
  <text x="597" y="460" text-anchor="middle" font-size="11" fill="#aaa">Nosilci se "naguban" navzgor ⌢</text>
  <text x="597" y="476" text-anchor="middle" font-size="11" fill="#777">M diagram narišemo NAD os</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- CENTER divider + key rule -->
  <!-- ═══════════════════════════════════════════════════ -->
  <line x1="400" y1="65" x2="400" y2="495" stroke="#444" stroke-width="1" stroke-dasharray="5,4"/>

</svg>
