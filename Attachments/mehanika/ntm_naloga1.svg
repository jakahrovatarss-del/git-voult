<svg viewBox="0 0 680 510" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
<text x="340" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">NALOGA 1 — Prosta greda: F + q</text>

<!-- ── KONSTRUKCIJA ── -->
<!-- Beam (6m = 480px, 80px/m) A=x80, B=x560 -->
<rect x="80" y="65" width="480" height="10" rx="2" fill="#555"/>
<!-- Pin A -->
<polygon points="80,65 66,96 94,96" fill="white" stroke="#333" stroke-width="2"/>
<line x1="54" y1="99" x2="106" y2="99" stroke="#333" stroke-width="2"/>
<!-- Roller B -->
<polygon points="560,65 546,96 574,96" fill="white" stroke="#333" stroke-width="2"/>
<circle cx="549" cy="102" r="4" fill="none" stroke="#333" stroke-width="1.5"/>
<circle cx="561" cy="102" r="4" fill="none" stroke="#333" stroke-width="1.5"/>
<line x1="537" y1="108" x2="585" y2="108" stroke="#333" stroke-width="2"/>
<!-- Labels A, B -->
<text x="66" y="62" font-size="12" font-weight="bold" fill="#222">A</text>
<text x="563" y="62" font-size="12" font-weight="bold" fill="#222">B</text>
<!-- F ↓ at x=240 (2m) -->
<line x1="240" y1="30" x2="240" y2="62" stroke="#cc0000" stroke-width="2"/>
<polygon points="234,61 240,70 246,61" fill="#cc0000"/>
<text x="252" y="48" font-size="11" fill="#cc0000" font-weight="bold">F=10 kN</text>
<!-- q distributed from x=240 to x=560 -->
<line x1="240" y1="42" x2="560" y2="42" stroke="#cc0000" stroke-width="1.5"/>
<text x="400" y="37" text-anchor="middle" font-size="11" fill="#cc0000">q = 2 kN/m</text>
<g stroke="#cc0000" stroke-width="1.5" fill="#cc0000">
  <line x1="280" y1="42" x2="280" y2="63"/><polygon points="276,60 280,67 284,60"/>
  <line x1="320" y1="42" x2="320" y2="63"/><polygon points="316,60 320,67 324,60"/>
  <line x1="360" y1="42" x2="360" y2="63"/><polygon points="356,60 360,67 364,60"/>
  <line x1="400" y1="42" x2="400" y2="63"/><polygon points="396,60 400,67 404,60"/>
  <line x1="440" y1="42" x2="440" y2="63"/><polygon points="436,60 440,67 444,60"/>
  <line x1="480" y1="42" x2="480" y2="63"/><polygon points="476,60 480,67 484,60"/>
  <line x1="520" y1="42" x2="520" y2="63"/><polygon points="516,60 520,67 524,60"/>
  <line x1="560" y1="42" x2="560" y2="63"/><polygon points="556,60 560,67 564,60"/>
</g>
<!-- Reactions ↑ -->
<line x1="80" y1="116" x2="80" y2="92" stroke="#006600" stroke-width="2"/>
<polygon points="74,92 80,81 86,92" fill="#006600"/>
<text x="10" y="130" font-size="10" fill="#006600">Ay=9.33 kN</text>
<line x1="560" y1="116" x2="560" y2="92" stroke="#006600" stroke-width="2"/>
<polygon points="554,92 560,81 566,92" fill="#006600"/>
<text x="566" y="112" font-size="10" fill="#006600">By=8.67 kN</text>
<!-- Dimension lines -->
<line x1="80" y1="124" x2="240" y2="124" stroke="#aaa" stroke-width="1"/>
<text x="160" y="138" text-anchor="middle" font-size="10" fill="#888">2 m</text>
<line x1="240" y1="124" x2="560" y2="124" stroke="#aaa" stroke-width="1"/>
<text x="400" y="138" text-anchor="middle" font-size="10" fill="#888">4 m</text>
<line x1="80" y1="147" x2="560" y2="147" stroke="#aaa" stroke-width="1"/>
<text x="320" y="160" text-anchor="middle" font-size="10" fill="#888">L = 6 m</text>

<line x1="10" y1="167" x2="670" y2="167" stroke="#ddd" stroke-width="1"/>

<!-- ── N DIAGRAM ── -->
<text x="10" y="186" font-size="12" font-weight="bold" fill="#1a1a8c">N [kN]</text>
<line x1="80" y1="193" x2="560" y2="193" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
<!-- N = 0 (flat line) -->
<line x1="80" y1="193" x2="560" y2="193" stroke="#1a1a8c" stroke-width="2.5"/>
<text x="68" y="196" text-anchor="end" font-size="10" fill="#555">0</text>
<text x="320" y="207" text-anchor="middle" font-size="10" fill="#1a1a8c" font-style="italic">N = 0 (ni vodoravnih sil)</text>

<line x1="10" y1="218" x2="670" y2="218" stroke="#ddd" stroke-width="1"/>

<!-- ── T DIAGRAM ── -->
<text x="10" y="236" font-size="12" font-weight="bold" fill="#006600">T [kN]</text>
<!-- baseline y=285 -->
<line x1="80" y1="285" x2="560" y2="285" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
<text x="68" y="288" text-anchor="end" font-size="10" fill="#555">0</text>
<!-- Pos area I: +9.33 kN, 5px/kN = 46.7px above baseline → y=285-47=238 -->
<polygon points="80,285 80,238 240,238 240,285" fill="rgba(0,140,0,0.18)" stroke="#006600" stroke-width="2"/>
<text x="160" y="254" text-anchor="middle" font-size="11" fill="#006600" font-weight="bold">+9.33</text>
<!-- Neg area II: -0.67→-8.67 below baseline. 5px/kN: 3.3px→43.3px below -->
<polygon points="240,285 240,288 560,328 560,285" fill="rgba(180,0,0,0.13)" stroke="#990000" stroke-width="2"/>
<text x="420" y="318" text-anchor="middle" font-size="11" fill="#990000">-0.67 → -8.67</text>
<!-- Discontinuity at x=240 -->
<line x1="240" y1="238" x2="240" y2="288" stroke="#555" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="244" y="262" font-size="9" fill="#555">skok↓F</text>
<!-- Tick marks -->
<line x1="73" y1="238" x2="83" y2="238" stroke="#006600" stroke-width="1"/>
<text x="68" y="241" text-anchor="end" font-size="9" fill="#006600">+9.33</text>
<line x1="553" y1="328" x2="563" y2="328" stroke="#990000" stroke-width="1"/>
<text x="68" y="331" text-anchor="end" font-size="9" fill="#990000">-8.67</text>
<!-- x-labels -->
<text x="80" y="340" text-anchor="middle" font-size="10" fill="#555">A</text>
<text x="240" y="340" text-anchor="middle" font-size="10" fill="#555">2m</text>
<text x="560" y="340" text-anchor="middle" font-size="10" fill="#555">B</text>

<line x1="10" y1="348" x2="670" y2="348" stroke="#ddd" stroke-width="1"/>

<!-- ── M DIAGRAM ── -->
<text x="10" y="366" font-size="12" font-weight="bold" fill="#8B4500">M [kNm]</text>
<!-- baseline y=490 -->
<line x1="80" y1="490" x2="560" y2="490" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
<text x="68" y="493" text-anchor="end" font-size="10" fill="#555">0</text>
<!-- M diagram (positive = above baseline):
  [0→2m]: linear 0→18.67 kNm. 3px/kNm → 56px. y=490-56=434 at x=240
  [2→6m]: parabolic back to 0.
    x=3m(px=320): M=17 → y=490-51=439
    x=4m(px=400): M=13.33 → y=490-40=450
    x=5m(px=480): M=7.67 → y=490-23=467
    x=6m(px=560): M=0 → y=490
-->
<path d="M 80,490 L 240,434 L 320,439 L 400,450 L 480,467 L 560,490 Z"
      fill="rgba(139,69,0,0.18)" stroke="#8B4500" stroke-width="2"/>
<!-- Mmax label -->
<text x="240" y="428" text-anchor="middle" font-size="12" fill="#8B4500" font-weight="bold">18.67 kNm</text>
<line x1="240" y1="434" x2="240" y2="490" stroke="#8B4500" stroke-width="1" stroke-dasharray="2,2"/>
<!-- Tick -->
<line x1="73" y1="434" x2="83" y2="434" stroke="#8B4500" stroke-width="1"/>
<text x="68" y="437" text-anchor="end" font-size="9" fill="#8B4500">18.67</text>
<!-- x-labels -->
<text x="80" y="505" text-anchor="middle" font-size="10" fill="#555">A</text>
<text x="240" y="505" text-anchor="middle" font-size="10" fill="#555">x=2m</text>
<text x="400" y="505" text-anchor="middle" font-size="10" fill="#555">x=4m</text>
<text x="560" y="505" text-anchor="middle" font-size="10" fill="#555">B</text>

<!-- Note -->
<text x="340" y="480" text-anchor="middle" font-size="10" fill="#8B4500" font-style="italic">Mmax = 18.67 kNm pri x = 2m (kjer T=0)</text>
</svg>
