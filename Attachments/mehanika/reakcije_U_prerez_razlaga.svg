<svg viewBox="0 0 820 540" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <rect width="820" height="540" fill="#1a1a2e" rx="12"/>
  <text x="410" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#e0e0e0">Reakcije in M(ξ) — korak za korakom</text>

  <!-- ═══════════════════════════════ TOP: Beam geometry ═══════════════════════════════ -->
  <rect x="15" y="38" width="790" height="175" rx="8" fill="#0d1b2a" stroke="#2196F3" stroke-width="1.2"/>
  <text x="410" y="56" text-anchor="middle" font-size="12" font-weight="bold" fill="#2196F3">Geometrija — razdalje od levega prostega konca</text>

  <!-- Beam line -->
  <line x1="80" y1="120" x2="680" y2="120" stroke="#FFD700" stroke-width="5"/>

  <!-- Support A at x=1m (pixel 80 + 150 = 230) -->
  <polygon points="230,120 218,140 242,140" fill="#90CAF9"/>
  <line x1="210" y1="144" x2="250" y2="144" stroke="#90CAF9" stroke-width="2"/>
  <!-- Support B at x=3.5m (pixel 80 + 525 = 605) -->
  <polygon points="605,120 593,140 617,140" fill="#90CAF9"/>
  <line x1="585" y1="144" x2="625" y2="144" stroke="#90CAF9" stroke-width="2"/>

  <!-- F arrow at free end (x=0) -->
  <line x1="80" y1="85" x2="80" y2="114" stroke="#FF5252" stroke-width="2.5"/>
  <polygon points="80,117 75,107 85,107" fill="#FF5252"/>
  <text x="80" y="81" text-anchor="middle" font-size="12" font-weight="bold" fill="#FF5252">F=10kN</text>

  <!-- q distributed load (from A to B) -->
  <g stroke="#FF9800" fill="#FF9800">
    <line x1="230" y1="82" x2="230" y2="114" stroke-width="1.5"/> <polygon points="230,117 226,108 234,108"/>
    <line x1="275" y1="82" x2="275" y2="114" stroke-width="1.5"/> <polygon points="275,117 271,108 279,108"/>
    <line x1="320" y1="82" x2="320" y2="114" stroke-width="1.5"/> <polygon points="320,117 316,108 324,108"/>
    <line x1="365" y1="82" x2="365" y2="114" stroke-width="1.5"/> <polygon points="365,117 361,108 369,108"/>
    <line x1="410" y1="82" x2="410" y2="114" stroke-width="1.5"/> <polygon points="410,117 406,108 414,108"/>
    <line x1="455" y1="82" x2="455" y2="114" stroke-width="1.5"/> <polygon points="455,117 451,108 459,108"/>
    <line x1="500" y1="82" x2="500" y2="114" stroke-width="1.5"/> <polygon points="500,117 496,108 504,108"/>
    <line x1="545" y1="82" x2="545" y2="114" stroke-width="1.5"/> <polygon points="545,117 541,108 549,108"/>
    <line x1="590" y1="82" x2="590" y2="114" stroke-width="1.5"/> <polygon points="590,117 586,108 594,108"/>
    <line x1="605" y1="82" x2="605" y2="114" stroke-width="1.5"/> <polygon points="605,117 601,108 609,108"/>
  </g>
  <line x1="230" y1="82" x2="605" y2="82" stroke="#FF9800" stroke-width="1.5"/>
  <text x="417" y="78" text-anchor="middle" font-size="11" fill="#FF9800">q = 16 kN/m</text>

  <!-- Reaction arrows (up) -->
  <line x1="230" y1="158" x2="230" y2="144" stroke="#4FC3F7" stroke-width="2.5"/>
  <polygon points="230,141 225,152 235,152" fill="#4FC3F7"/>
  <text x="230" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#4FC3F7">R_A</text>

  <line x1="605" y1="158" x2="605" y2="144" stroke="#4FC3F7" stroke-width="2.5"/>
  <polygon points="605,141 600,152 610,152" fill="#4FC3F7"/>
  <text x="605" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#4FC3F7">R_B</text>

  <!-- Dimension lines -->
  <!-- 0 to A = 1m -->
  <line x1="80" y1="192" x2="230" y2="192" stroke="#aaa" stroke-width="1"/>
  <line x1="80" y1="188" x2="80" y2="196" stroke="#aaa" stroke-width="1"/>
  <line x1="230" y1="188" x2="230" y2="196" stroke="#aaa" stroke-width="1"/>
  <text x="155" y="205" text-anchor="middle" font-size="11" fill="#aaa">1 m (previs)</text>

  <!-- A to B = 2.5m -->
  <line x1="230" y1="192" x2="605" y2="192" stroke="#aaa" stroke-width="1"/>
  <line x1="605" y1="188" x2="605" y2="196" stroke="#aaa" stroke-width="1"/>
  <text x="417" y="205" text-anchor="middle" font-size="11" fill="#aaa">2,5 m (polje L)</text>

  <!-- Labels A, B -->
  <text x="230" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#4FC3F7">A</text>
  <text x="605" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#4FC3F7">B</text>
  <text x="80" y="148" text-anchor="middle" font-size="11" fill="#aaa">x=0</text>

  <!-- ═══════════════════════════════ MIDDLE: ΣM_B razlaga ═══════════════════════════════ -->
  <rect x="15" y="222" width="790" height="158" rx="8" fill="#0d1b2a" stroke="#9C27B0" stroke-width="1.2"/>
  <text x="410" y="241" text-anchor="middle" font-size="12" font-weight="bold" fill="#CE93D8">Korak 1: ΣM_B = 0  — zakaj vsak člen?</text>

  <!-- Mini beam diagram for moment arms -->
  <line x1="90" y1="305" x2="620" y2="305" stroke="#FFD700" stroke-width="3"/>

  <!-- F -->
  <line x1="90" y1="280" x2="90" y2="299" stroke="#FF5252" stroke-width="2"/>
  <polygon points="90,302 86,293 94,293" fill="#FF5252"/>
  <text x="90" y="276" text-anchor="middle" font-size="10" fill="#FF5252">F=10</text>

  <!-- A support -->
  <polygon points="230,305 222,318 238,318" fill="#90CAF9" opacity="0.6"/>
  <text x="230" y="330" text-anchor="middle" font-size="10" fill="#4FC3F7">A</text>
  <text x="230" y="342" text-anchor="middle" font-size="9" fill="#4FC3F7">R_A=?</text>

  <!-- q resultant arrow at center of A-B -->
  <line x1="418" y1="278" x2="418" y2="299" stroke="#FF9800" stroke-width="2"/>
  <polygon points="418,302 414,293 422,293" fill="#FF9800"/>
  <text x="418" y="274" text-anchor="middle" font-size="10" fill="#FF9800">Q=40kN</text>
  <text x="418" y="262" text-anchor="middle" font-size="9" fill="#888">(q·2,5=40)</text>

  <!-- B support (pivot) -->
  <polygon points="618,305 610,318 626,318" fill="#90CAF9"/>
  <text x="618" y="330" text-anchor="middle" font-size="10" fill="#4FC3F7">B</text>
  <circle cx="618" cy="305" r="4" fill="#FF4081"/>
  <text x="618" y="350" text-anchor="middle" font-size="9" fill="#FF4081">vrtišče!</text>

  <!-- Moment arms with braces -->
  <!-- F to B = 3.5m -->
  <line x1="90" y1="358" x2="618" y2="358" stroke="#FF5252" stroke-width="1.5"/>
  <line x1="90" y1="354" x2="90" y2="362" stroke="#FF5252"/>
  <line x1="618" y1="354" x2="618" y2="362" stroke="#FF5252"/>
  <text x="354" y="371" text-anchor="middle" font-size="10" fill="#FF5252">3,5 m  → F·3,5 = 10·3,5 = 35 kNm ↻</text>

  <!-- Q to B = 1.25m -->
  <line x1="418" y1="382" x2="618" y2="382" stroke="#FF9800" stroke-width="1.5"/>
  <line x1="418" y1="378" x2="418" y2="386" stroke="#FF9800"/>
  <line x1="618" y1="378" x2="618" y2="386" stroke="#FF9800"/>
  <text x="518" y="375" text-anchor="middle" font-size="10" fill="#FF9800">1,25 m  → Q·1,25 = 40·1,25 = 50 kNm ↻</text>

  <!-- Where does 1.25m come from -->
  <text x="180" y="357" text-anchor="middle" font-size="9" fill="#888">od B:</text>

  <!-- ═══════════════════════════════ BOTTOM: M(ξ) derivacija ═══════════════════════════════ -->
  <rect x="15" y="390" width="790" height="138" rx="8" fill="#0d1b2a" stroke="#4CAF50" stroke-width="1.2"/>
  <text x="410" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#81C784">Korak 2: M(ξ) — vsota momentov LEVO od prereza ξ</text>

  <!-- Mini beam for M(x) -->
  <line x1="90" y1="450" x2="620" y2="450" stroke="#FFD700" stroke-width="3" opacity="0.5"/>

  <!-- Section cut marker -->
  <line x1="390" y1="432" x2="390" y2="468" stroke="#FF4081" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="390" y="478" text-anchor="middle" font-size="10" fill="#FF4081">prerez</text>

  <!-- Left side forces -->
  <line x1="90" y1="432" x2="90" y2="444" stroke="#FF5252" stroke-width="2"/>
  <polygon points="90,447 86,439 94,439" fill="#FF5252"/>
  <text x="70" y="430" text-anchor="middle" font-size="9" fill="#FF5252">F↓</text>

  <!-- R_A arrow -->
  <line x1="230" y1="460" x2="230" y2="450" stroke="#4FC3F7" stroke-width="2"/>
  <polygon points="230,447 225,457 235,457" fill="#4FC3F7"/>
  <text x="230" y="474" text-anchor="middle" font-size="9" fill="#4FC3F7">R_A↑</text>

  <!-- q arrow -->
  <line x1="300" y1="432" x2="300" y2="444" stroke="#FF9800" stroke-width="1.5"/>
  <polygon points="300,447 296,439 304,439" fill="#FF9800"/>
  <text x="300" y="429" text-anchor="middle" font-size="9" fill="#FF9800">q↓</text>

  <!-- Labels -->
  <text x="155" y="440" text-anchor="middle" font-size="9" fill="#888">(1+ξ)</text>
  <text x="310" y="497" text-anchor="middle" font-size="9" fill="#888">ξ/2</text>
  <text x="235" y="496" text-anchor="middle" font-size="9" fill="#888">ξ</text>

  <!-- Formula breakdown -->
  <text x="30" y="510" font-size="11" fill="#81C784">M(ξ)  =</text>
  <text x="90" y="510" font-size="11" fill="#FF5252">  −F·(1+ξ)</text>
  <text x="215" y="510" font-size="11" fill="#888">  +</text>
  <text x="230" y="510" font-size="11" fill="#4FC3F7">  R_A·ξ</text>
  <text x="315" y="510" font-size="11" fill="#888">  −</text>
  <text x="330" y="510" font-size="11" fill="#FF9800">  q·ξ²/2</text>
  <text x="440" y="510" font-size="11" fill="#888">  =</text>
  <text x="460" y="510" font-size="11" fill="#FF5252">−10(1+ξ)</text>
  <text x="558" y="510" font-size="11" fill="#4FC3F7">+34ξ</text>
  <text x="610" y="510" font-size="11" fill="#FF9800">−8ξ²</text>

  <text x="30" y="525" font-size="11" fill="#888">razvijemo: −10 − 10ξ + 34ξ − 8ξ²  =</text>
  <text x="350" y="525" font-size="11" font-weight="bold" fill="#81C784">  −10 + 24ξ − 8ξ²  ✓</text>

</svg>
