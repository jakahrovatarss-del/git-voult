<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="'Latin Modern Math', 'STIX Two Math', serif" font-size="14">
  <!-- Background -->
  <rect width="700" height="420" fill="#fafafa" rx="8"/>
  <text x="350" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">NALOGA 1 — Dvigalo s škripcem (L-nosilci)</text>

  <!-- Ground hatch at B -->
  <line x1="140" y1="360" x2="260" y2="360" stroke="#555" stroke-width="2"/>
  <line x1="145" y1="360" x2="135" y2="375" stroke="#555" stroke-width="1.5"/>
  <line x1="160" y1="360" x2="150" y2="375" stroke="#555" stroke-width="1.5"/>
  <line x1="175" y1="360" x2="165" y2="375" stroke="#555" stroke-width="1.5"/>
  <line x1="190" y1="360" x2="180" y2="375" stroke="#555" stroke-width="1.5"/>
  <line x1="205" y1="360" x2="195" y2="375" stroke="#555" stroke-width="1.5"/>
  <line x1="220" y1="360" x2="210" y2="375" stroke="#555" stroke-width="1.5"/>
  <line x1="235" y1="360" x2="225" y2="375" stroke="#555" stroke-width="1.5"/>
  <line x1="250" y1="360" x2="240" y2="375" stroke="#555" stroke-width="1.5"/>

  <!-- Vpetje symbol at B -->
  <rect x="182" y="350" width="36" height="12" fill="#888" stroke="#444" stroke-width="1.5" rx="2"/>

  <!-- Vertical steber (B bottom → A top) -->
  <line x1="200" y1="130" x2="200" y2="350" stroke="#1a3a6b" stroke-width="7" stroke-linecap="round"/>

  <!-- Horizontal arm (A → pulley) -->
  <line x1="200" y1="130" x2="420" y2="130" stroke="#1a3a6b" stroke-width="7" stroke-linecap="round"/>

  <!-- Pulley circle at A end -->
  <circle cx="440" cy="130" r="22" fill="none" stroke="#2a6099" stroke-width="2.5"/>
  <circle cx="440" cy="130" r="5" fill="#2a6099"/>

  <!-- Rope vertical (tovor navzdol) -->
  <line x1="440" y1="152" x2="440" y2="320" stroke="#b8860b" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Mass (tovor) -->
  <rect x="415" y="320" width="50" height="35" fill="#e8c96a" stroke="#b8860b" stroke-width="2" rx="4"/>
  <text x="440" y="342" text-anchor="middle" font-size="12" fill="#5a3a00" font-weight="bold">m=20kg</text>

  <!-- G arrow on mass -->
  <line x1="440" y1="355" x2="440" y2="395" stroke="#c0392b" stroke-width="2"/>
  <polygon points="440,400 435,388 445,388" fill="#c0392b"/>
  <text x="450" y="398" font-size="13" fill="#c0392b" font-weight="bold">G=0,2kN</text>

  <!-- Point labels -->
  <circle cx="200" cy="350" r="5" fill="#c0392b"/>
  <text x="170" y="355" font-size="14" font-weight="bold" fill="#c0392b">B</text>

  <circle cx="200" cy="130" r="5" fill="#27ae60"/>
  <text x="175" y="128" font-size="14" font-weight="bold" fill="#27ae60">A</text>

  <!-- Dimension H (height of steber) -->
  <line x1="100" y1="130" x2="100" y2="350" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="95" y1="130" x2="105" y2="130" stroke="#888" stroke-width="1.5"/>
  <line x1="95" y1="350" x2="105" y2="350" stroke="#888" stroke-width="1.5"/>
  <text x="70" y="248" font-size="13" fill="#555" font-style="italic">H=5m</text>

  <!-- Dimension a (horizontal arm) -->
  <line x1="200" y1="90" x2="440" y2="90" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="200" y1="85" x2="200" y2="95" stroke="#888" stroke-width="1.5"/>
  <line x1="440" y1="85" x2="440" y2="95" stroke="#888" stroke-width="1.5"/>
  <text x="305" y="83" font-size="13" fill="#555" font-style="italic" text-anchor="middle">a=2m</text>

  <!-- Reactions at B -->
  <!-- By (up) -->
  <line x1="200" y1="350" x2="200" y2="310" stroke="#27ae60" stroke-width="2.5"/>
  <polygon points="200,305 194,318 206,318" fill="#27ae60"/>
  <text x="210" y="325" font-size="13" fill="#27ae60" font-weight="bold">By</text>

  <!-- Bx (horizontal) -->
  <line x1="200" y1="350" x2="155" y2="350" stroke="#e67e22" stroke-width="2.5"/>
  <polygon points="150,350 163,344 163,356" fill="#e67e22"/>
  <text x="128" y="348" font-size="13" fill="#e67e22" font-weight="bold">Bx</text>

  <!-- MB (moment arc) -->
  <path d="M 230 340 A 20 20 0 0 0 215 322" stroke="#8e44ad" stroke-width="2" fill="none"/>
  <polygon points="215,322 208,332 220,328" fill="#8e44ad"/>
  <text x="232" y="332" font-size="13" fill="#8e44ad" font-weight="bold">MB</text>

  <!-- Result box -->
  <rect x="490" y="200" width="190" height="110" fill="#eaf4fb" stroke="#2a6099" stroke-width="1.5" rx="6"/>
  <text x="585" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a6b">Rezultati:</text>
  <text x="500" y="242" font-size="12" fill="#333">Bx = 0 kN</text>
  <text x="500" y="260" font-size="12" fill="#333">By = 0,2 kN ↑</text>
  <text x="500" y="278" font-size="12" fill="#333">MB = G · a</text>
  <text x="500" y="296" font-size="12" fill="#c0392b" font-weight="bold">MB = 0,4 kNm</text>

  <!-- Warning -->
  <text x="350" y="400" text-anchor="middle" font-size="12" fill="#c0392b">⚠ Ročica momenta = a (vodoravna razdalja), NE višina H!</text>
</svg>
