<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
<text x="380" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">NALOGA 4 — Deformacijski tenzor → Napetostni tenzor</text>

<!-- FLOW DIAGRAM: top portion -->

<!-- Step boxes, left to right flow -->
<!-- Box 1: εij -->
<rect x="30" y="45" width="130" height="90" rx="6" fill="#e8f0ff" stroke="#336699" stroke-width="2"/>
<text x="95" y="63" text-anchor="middle" font-size="11" font-weight="bold" fill="#336699">Deform. tenzor εij</text>
<text x="38" y="80" font-size="10" fill="#333">εx = +2×10⁻⁴</text>
<text x="38" y="94" font-size="10" fill="#333">εy = −1×10⁻⁴</text>
<text x="38" y="108" font-size="10" fill="#333">εz = 0,5×10⁻⁴</text>
<text x="38" y="122" font-size="10" fill="#555">γxy = 2×10⁻⁴</text>

<!-- Arrow -->
<line x1="160" y1="90" x2="195" y2="90" stroke="#555" stroke-width="2"/>
<polygon points="191,85 200,90 191,95" fill="#555"/>

<!-- Box 2: Material constants -->
<rect x="200" y="45" width="130" height="90" rx="6" fill="#fff8ee" stroke="#cc6600" stroke-width="2"/>
<text x="265" y="63" text-anchor="middle" font-size="11" font-weight="bold" fill="#cc6600">Material E, ν</text>
<text x="208" y="80" font-size="10" fill="#333">E = 210 000 MPa</text>
<text x="208" y="94" font-size="10" fill="#333">ν = 0,30</text>
<text x="208" y="115" font-size="9" fill="#555">λ = Eν/((1+ν)(1−2ν))</text>
<text x="208" y="128" font-size="10" fill="#cc6600" font-weight="bold">λ = 121 154 MPa</text>

<!-- Arrow -->
<line x1="330" y1="90" x2="365" y2="90" stroke="#555" stroke-width="2"/>
<polygon points="361,85 370,90 361,95" fill="#555"/>

<!-- Box 3: G and εv -->
<rect x="370" y="45" width="140" height="90" rx="6" fill="#e8f4e8" stroke="#006600" stroke-width="2"/>
<text x="440" y="63" text-anchor="middle" font-size="11" font-weight="bold" fill="#006600">G in εv</text>
<text x="378" y="80" font-size="10" fill="#333">G = E/(2(1+ν))</text>
<text x="378" y="94" font-size="10" fill="#006600" font-weight="bold">G = 80 769 MPa</text>
<text x="378" y="112" font-size="10" fill="#333">εv = εx+εy+εz</text>
<text x="378" y="126" font-size="10" fill="#006600" font-weight="bold">εv = 1,5×10⁻⁴</text>

<!-- Arrow -->
<line x1="510" y1="90" x2="545" y2="90" stroke="#555" stroke-width="2"/>
<polygon points="541,85 550,90 541,95" fill="#555"/>

<!-- Box 4: σij via Hooke -->
<rect x="555" y="45" width="180" height="90" rx="6" fill="#ffe8f0" stroke="#cc0066" stroke-width="2"/>
<text x="645" y="63" text-anchor="middle" font-size="11" font-weight="bold" fill="#cc0066">Hookov zakon</text>
<text x="563" y="80" font-size="9" fill="#333">σij = λ·εv·δij + 2G·εij</text>
<text x="563" y="96" font-size="10" fill="#cc0066" font-weight="bold">σx = 50,48 MPa</text>
<text x="563" y="110" font-size="10" fill="#cc0066" font-weight="bold">σy = +2,02 MPa</text>
<text x="563" y="124" font-size="10" fill="#cc0066" font-weight="bold">τxy = 16,15 MPa</text>

<!-- Separator line -->
<line x1="30" y1="152" x2="740" y2="152" stroke="#ccc" stroke-width="1" stroke-dasharray="5,3"/>

<!-- BOTTOM: Mohr's circle derived from σx,σy,τxy -->
<!-- σsr = (50.48+2.02)/2 = 26.25; R=√((24.23)²+(16.15)²)=√(587+261)=√848=29.12 -->
<!-- Wait: R=√((σx-σy)²/4 + τ²)=√((48.46/2)²+16.15²)=√(590.5+260.8)=√851.3=29.18 -->
<!-- σ1 = 26.25+29.18=55.43; σ2 = 26.25-29.18=-2.93... but σz=26.25 -->
<!-- Actually from solution: σ1=55.37, σ2=26.25(=σz), σ3=-2.87 -->
<!-- For 2D circle: σsr=26.25, R=29.12, σ1(2D)=55.37, σ2(2D)=-2.87 -->
<!-- Origin at (450, 340). Scale: 4 px/MPa -->
<!-- σsr=26.25→x=450+26.25*4=555; R=29.12→117px -->
<!-- σ1=55.37→x=450+55.37*4=671; σ3=-2.87→x=450-2.87*4=438 -->
<!-- A(σx=50.48,τxy=16.15): x=450+50.48*4=652, y=340+16.15*4=405 -->
<!-- B(σy=2.02,-τxy): x=450+2.02*4=458, y=340-16.15*4=275 -->

<text x="380" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Mohrova krožnica iz σij (2D)</text>
<text x="380" y="192" text-anchor="middle" font-size="10" fill="#555">σz = 26,25 MPa postane σ₂ (vmesna glavna napetost)</text>

<!-- Axes. Origin = (450, 340) -->
<line x1="290" y1="340" x2="720" y2="340" stroke="#333" stroke-width="1.5"/>
<polygon points="716,335 726,340 716,345" fill="#333"/>
<text x="730" y="344" font-size="11" fill="#333">σ</text>

<line x1="450" y1="180" x2="450" y2="470" stroke="#333" stroke-width="1.5"/>
<polygon points="445,184 450,174 455,184" fill="#333"/>
<text x="430" y="174" font-size="11" fill="#333">τ</text>

<!-- Grid marks -->
<g font-size="9" fill="#888" text-anchor="middle">
  <line x1="438" y1="336" x2="438" y2="344" stroke="#aaa"/> <text x="438" y="354">−3</text>
  <line x1="490" y1="336" x2="490" y2="344" stroke="#aaa"/> <text x="490" y="354">10</text>
  <line x1="530" y1="336" x2="530" y2="344" stroke="#aaa"/> <text x="530" y="354">20</text>
  <line x1="555" y1="336" x2="555" y2="344" stroke="#aaa"/> <text x="555" y="354">26</text>
  <line x1="610" y1="336" x2="610" y2="344" stroke="#aaa"/> <text x="610" y="354">40</text>
  <line x1="651" y1="336" x2="651" y2="344" stroke="#aaa"/> <text x="651" y="354">50</text>
  <line x1="671" y1="336" x2="671" y2="344" stroke="#aaa"/> <text x="671" y="354">55</text>
</g>
<g font-size="9" fill="#888" text-anchor="end">
  <line x1="446" y1="275" x2="454" y2="275" stroke="#aaa"/> <text x="444" y="278">−16</text>
  <line x1="446" y1="405" x2="454" y2="405" stroke="#aaa"/> <text x="444" y="408">+16</text>
  <line x1="446" y1="222" x2="454" y2="222" stroke="#aaa"/> <text x="444" y="225">−29</text>
  <line x1="446" y1="458" x2="454" y2="458" stroke="#aaa"/> <text x="444" y="461">+29</text>
</g>

<!-- Mohr circle: cx=555, cy=340, R=116 -->
<circle cx="555" cy="340" r="116" fill="rgba(200,50,100,0.07)" stroke="#cc0066" stroke-width="2"/>

<!-- Points A and B -->
<circle cx="652" cy="405" r="5" fill="#cc0066"/>
<text x="659" y="403" font-size="10" fill="#cc0066" font-weight="bold">A(50,48; 16,15)</text>

<circle cx="458" cy="275" r="5" fill="#6633cc"/>
<text x="400" y="268" font-size="10" fill="#6633cc" font-weight="bold">B(2,02; −16,15)</text>

<!-- Diameter -->
<line x1="652" y1="405" x2="458" y2="275" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>

<!-- Center C -->
<circle cx="555" cy="340" r="4" fill="#cc0066"/>
<text x="560" y="332" font-size="10" fill="#cc0066">C(26,25; 0)</text>

<!-- σ1 = 671 -->
<circle cx="671" cy="340" r="5" fill="#cc0000"/>
<text x="671" y="325" text-anchor="middle" font-size="11" fill="#cc0000" font-weight="bold">σ₁=55,37</text>

<!-- σ3 = 438 -->
<circle cx="438" cy="340" r="5" fill="#0066cc"/>
<text x="438" y="358" text-anchor="middle" font-size="11" fill="#0066cc" font-weight="bold">σ₃=−2,87</text>

<!-- σz = σ2 marker -->
<line x1="555" y1="320" x2="555" y2="340" stroke="#006600" stroke-width="1.5" stroke-dasharray="3,2"/>
<circle cx="555" cy="320" r="4" fill="#006600"/>
<text x="555" y="313" text-anchor="middle" font-size="10" fill="#006600" font-weight="bold">σ₂=σz=26,25</text>

<!-- τmax (top of circle) -->
<circle cx="555" cy="224" r="4" fill="#8B4500"/>
<text x="575" y="219" font-size="10" fill="#8B4500">τmax=29,12 MPa</text>

<!-- Results box bottom right -->
<rect x="560" y="415" width="175" height="75" rx="5" fill="#e8f4e8" stroke="#006600" stroke-width="1.5"/>
<text x="647" y="432" text-anchor="middle" font-size="10" font-weight="bold" fill="#005500">Kontrola I₁</text>
<text x="568" y="447" font-size="9" fill="#333">σx+σy+σz = 50,48+2,02+26,25</text>
<text x="568" y="460" font-size="9" fill="#333">= 78,75 MPa</text>
<text x="568" y="474" font-size="9" fill="#333">σ₁+σ₂+σ₃ = 55,37+26,25−2,87</text>
<text x="568" y="487" font-size="10" fill="#006600" font-weight="bold">= 78,75 MPa ✓</text>
</svg>
