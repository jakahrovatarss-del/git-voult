<svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="13">

  <text x="340" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">Aluminijast kvader — 3D obtežba in Hookov zakon</text>

  <!-- === KVADER (izometrično) === -->
  <g transform="translate(140, 50)">

    <!-- Dimenzije: a=100mm(x), b=150mm(y), H=200mm(z) -->
    <!-- Pikselska skala: a→80px, b→120px, H→180px -->
    <!-- Izometrična projekcija, z gor, x desno, y diagonalno -->

    <!-- Sprednja ploskev (x-z, y=0) -->
    <polygon points="60,300 140,300 140,120 60,120" fill="#d5e8f7" stroke="#2c5f8a" stroke-width="2"/>

    <!-- Desna ploskev (y-z, x=max) -->
    <polygon points="140,300 220,240 220,60 140,120" fill="#c0d9ef" stroke="#2c5f8a" stroke-width="2"/>

    <!-- Zgornja ploskev (x-y, z=max) -->
    <polygon points="60,120 140,120 220,60 140,60" fill="#aacde8" stroke="#2c5f8a" stroke-width="2"/>

    <!-- Skrite robove -->
    <line x1="60" y1="300" x2="140" y2="240" stroke="#2c5f8a" stroke-width="1" stroke-dasharray="5,3"/>
    <line x1="140" y1="240" x2="220" y2="240" stroke="#2c5f8a" stroke-width="1" stroke-dasharray="5,3"/>
    <line x1="140" y1="240" x2="140" y2="60" stroke="#2c5f8a" stroke-width="1" stroke-dasharray="5,3"/>

    <!-- === SILI === -->

    <!-- Fx (nateg v x smeri, desno) -->
    <line x1="140" y1="210" x2="210" y2="210" stroke="#c0392b" stroke-width="3" marker-end="url(#fxArr)"/>
    <text x="215" y="207" fill="#c0392b" font-weight="bold">F_x = 15 kN</text>
    <text x="215" y="222" fill="#c0392b" font-size="11">(nateg)</text>
    <!-- Fx na levi ploskvi -->
    <line x1="60" y1="210" x2="-10" y2="210" stroke="#c0392b" stroke-width="2" marker-end="url(#fxArr2)"/>

    <!-- Fz (tlak v z smeri, dol) -->
    <line x1="130" y1="60" x2="130" y2="5" stroke="#8e44ad" stroke-width="3" marker-end="url(#fzArrUp)"/>
    <text x="50" y="5" fill="#8e44ad" font-weight="bold">F_z = ?</text>
    <text x="50" y="20" fill="#8e44ad" font-size="11">(tlak, iščemo)</text>
    <!-- Fz spodaj -->
    <line x1="100" y1="300" x2="100" y2="345" stroke="#8e44ad" stroke-width="2" marker-end="url(#fzArrDn)"/>

    <!-- ΔH označba -->
    <line x1="42" y1="120" x2="42" y2="300" stroke="#e67e22" stroke-width="2"/>
    <line x1="37" y1="120" x2="47" y2="120" stroke="#e67e22" stroke-width="1.5"/>
    <line x1="37" y1="300" x2="47" y2="300" stroke="#e67e22" stroke-width="1.5"/>
    <text x="-30" y="215" fill="#e67e22" font-weight="bold" font-size="12">H = 200 mm</text>
    <text x="-40" y="232" fill="#e67e22" font-size="11">ΔH = −0.002 mm</text>

    <!-- Dimenzija a (širina x) -->
    <line x1="60" y1="318" x2="140" y2="318" stroke="#555" stroke-width="1"/>
    <line x1="60" y1="313" x2="60" y2="323" stroke="#555" stroke-width="1"/>
    <line x1="140" y1="313" x2="140" y2="323" stroke="#555" stroke-width="1"/>
    <text x="100" y="333" text-anchor="middle" fill="#555" font-size="11">a = 100 mm</text>

    <!-- Dimenzija b (globina y, diagonalno) -->
    <line x1="145" y1="305" x2="225" y2="245" stroke="#555" stroke-width="1"/>
    <text x="210" y="285" fill="#555" font-size="11">b = 150 mm</text>

    <!-- Koordinatne osi -->
    <line x1="60" y1="300" x2="0" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#axArr)"/>
    <text x="-12" y="300" fill="#333" font-size="11">x</text>
    <line x1="60" y1="300" x2="60" y2="350" stroke="#333" stroke-width="1.5" marker-end="url(#axArr)"/>
    <text x="64" y="365" fill="#333" font-size="11">z</text>
    <line x1="60" y1="300" x2="108" y2="268" stroke="#333" stroke-width="1.5" marker-end="url(#axArr)"/>
    <text x="115" y="268" fill="#333" font-size="11">y</text>

  </g>

  <!-- === REZULTATI === -->
  <g transform="translate(450, 80)">
    <rect x="0" y="0" width="210" height="200" rx="6" fill="#f0fff0" stroke="#27ae60" stroke-width="1.5"/>
    <text x="10" y="22" font-weight="bold" fill="#27ae60" font-size="13">Rezultati:</text>

    <text x="10" y="48" fill="#2c3e50" font-size="12">σ_x = +0.5 MPa (nateg)</text>
    <text x="10" y="68" fill="#2c3e50" font-size="12">σ_y = 0 MPa</text>
    <text x="10" y="88" fill="#c0392b" font-size="12">σ_z = −0.55 MPa (tlak)</text>

    <line x1="10" y1="98" x2="200" y2="98" stroke="#ccc" stroke-width="1"/>

    <text x="10" y="118" fill="#2c3e50" font-size="12">ε_z = −10⁻⁵ (pogoj)</text>
    <text x="10" y="138" fill="#8e44ad" font-size="12">ΔH = ε_z·H = −0.002 mm ✓</text>

    <line x1="10" y1="148" x2="200" y2="148" stroke="#ccc" stroke-width="1"/>

    <text x="10" y="168" font-weight="bold" fill="#e67e22" font-size="13">F_z = 8.25 kN</text>
    <text x="10" y="186" fill="#c0392b" font-size="11">Brez ν: F_z = 10.5 kN</text>
    <text x="10" y="202" fill="#c0392b" font-size="11">→ 21% napaka!</text>
  </g>

  <!-- === HOOKOV ZAKON === -->
  <rect x="20" y="350" width="630" height="55" rx="6" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1"/>
  <text x="30" y="370" font-weight="bold" fill="#2c3e50" font-size="12">Hookov zakon za ε_z:</text>
  <text x="30" y="390" fill="#c0392b" font-size="12" font-weight="bold">ε_z = [σ_z − ν(σ_x + σ_y)] / E</text>
  <text x="280" y="390" fill="#555" font-size="11">← Poissonov efekt: σ_x in σ_y vplivata na ε_z!</text>

  <defs>
    <marker id="fxArr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c0392b"/>
    </marker>
    <marker id="fxArr2" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto">
      <path d="M8,0 L8,6 L0,3 z" fill="#c0392b"/>
    </marker>
    <marker id="fzArrUp" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8e44ad"/>
    </marker>
    <marker id="fzArrDn" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8e44ad"/>
    </marker>
    <marker id="axArr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
