<svg viewBox="0 0 720 570" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
<text x="360" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">NALOGA 4 — Portalni okvir (simetričen, q na prečki)</text>

<!-- ── KONSTRUKCIJA ── -->
<!-- Portal frame: scale 50px/m
     Steber left CA: C=(100,60), A=(100,260) — 4m=200px
     Steber right DB: D=(460,60), B=(460,260) — 4m=200px
     Prečka CD: C=(100,60) to D=(460,60) — 6m=360px
-->
<!-- Prečka CD -->
<rect x="100" y="54" width="360" height="10" rx="2" fill="#555"/>
<!-- Steber CA (left) -->
<rect x="94" y="60" width="10" height="204" rx="2" fill="#555"/>
<!-- Steber DB (right) -->
<rect x="454" y="60" width="10" height="204" rx="2" fill="#555"/>

<!-- Togi vpetji A and B (filled triangles at bottom = fixed) -->
<!-- A: fixed support (box) -->
<rect x="82" y="260" width="26" height="12" fill="#555" stroke="#333" stroke-width="1"/>
<line x1="74" y1="273" x2="118" y2="273" stroke="#333" stroke-width="2"/>
<g stroke="#333" stroke-width="1">
  <line x1="74" y1="273" x2="78" y2="279"/>
  <line x1="82" y1="273" x2="86" y2="279"/>
  <line x1="90" y1="273" x2="94" y2="279"/>
  <line x1="98" y1="273" x2="102" y2="279"/>
  <line x1="106" y1="273" x2="110" y2="279"/>
  <line x1="114" y1="273" x2="118" y2="279"/>
</g>
<!-- B: pin support (triangle) -->
<polygon points="459,260 445,285 473,285" fill="white" stroke="#333" stroke-width="2"/>
<circle cx="449" cy="291" r="4" fill="none" stroke="#333" stroke-width="1.5"/>
<circle cx="459" cy="291" r="4" fill="none" stroke="#333" stroke-width="1.5"/>
<line x1="437" y1="296" x2="481" y2="296" stroke="#333" stroke-width="2"/>

<!-- Corner labels -->
<text x="85" y="58" font-size="12" font-weight="bold" fill="#222">C</text>
<text x="465" y="58" font-size="12" font-weight="bold" fill="#222">D</text>
<text x="72" y="258" font-size="12" font-weight="bold" fill="#222">A</text>
<text x="464" y="258" font-size="12" font-weight="bold" fill="#222">B</text>

<!-- q distributed on prečka CD -->
<line x1="100" y1="36" x2="460" y2="36" stroke="#cc0000" stroke-width="1.5"/>
<text x="280" y="31" text-anchor="middle" font-size="11" fill="#cc0000">q = 1.5 kN/m</text>
<g stroke="#cc0000" stroke-width="1.5" fill="#cc0000">
  <line x1="100" y1="36" x2="100" y2="52"/><polygon points="96,49 100,56 104,49"/>
  <line x1="136" y1="36" x2="136" y2="52"/><polygon points="132,49 136,56 140,49"/>
  <line x1="172" y1="36" x2="172" y2="52"/><polygon points="168,49 172,56 176,49"/>
  <line x1="208" y1="36" x2="208" y2="52"/><polygon points="204,49 208,56 212,49"/>
  <line x1="244" y1="36" x2="244" y2="52"/><polygon points="240,49 244,56 248,49"/>
  <line x1="280" y1="36" x2="280" y2="52"/><polygon points="276,49 280,56 284,49"/>
  <line x1="316" y1="36" x2="316" y2="52"/><polygon points="312,49 316,56 320,49"/>
  <line x1="352" y1="36" x2="352" y2="52"/><polygon points="348,49 352,56 356,49"/>
  <line x1="388" y1="36" x2="388" y2="52"/><polygon points="384,49 388,56 392,49"/>
  <line x1="424" y1="36" x2="424" y2="52"/><polygon points="420,49 424,56 428,49"/>
  <line x1="460" y1="36" x2="460" y2="52"/><polygon points="456,49 460,56 464,49"/>
</g>

<!-- Reactions -->
<line x1="100" y1="285" x2="100" y2="265" stroke="#006600" stroke-width="2"/>
<polygon points="94,265 100,254 106,265" fill="#006600"/>
<text x="10" y="262" font-size="10" fill="#006600">Ay=4.5↑</text>
<line x1="459" y1="299" x2="459" y2="275" stroke="#006600" stroke-width="2"/>
<polygon points="453,275 459,264 465,275" fill="#006600"/>
<text x="468" y="278" font-size="10" fill="#006600">By=4.5↑</text>

<!-- Dimension lines -->
<line x1="100" y1="305" x2="460" y2="305" stroke="#aaa" stroke-width="1"/>
<text x="280" y="318" text-anchor="middle" font-size="10" fill="#888">6 m (prečka CD)</text>
<line x1="490" y1="60" x2="490" y2="260" stroke="#aaa" stroke-width="1"/>
<text x="510" y="165" font-size="10" fill="#888">4 m</text>

<!-- Simetrija note -->
<line x1="280" y1="54" x2="280" y2="70" stroke="#555" stroke-width="1" stroke-dasharray="3,2"/>
<text x="280" y="80" text-anchor="middle" font-size="9" fill="#555">os simetrije</text>

<line x1="10" y1="325" x2="710" y2="325" stroke="#ddd" stroke-width="1"/>

<!-- ── DIAGRAMI ── -->

<!-- === Steber CA (levo) === -->
<text x="170" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">Steber CA (levi)</text>
<!-- N steber: -4.5 kN (tlak) -->
<text x="10" y="360" font-size="11" font-weight="bold" fill="#1a1a8c">N</text>
<line x1="55" y1="366" x2="255" y2="366" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="55" y="358" width="200" height="8" rx="1" fill="rgba(0,0,180,0.15)" stroke="#1a1a8c" stroke-width="1.5"/>
<text x="155" y="380" text-anchor="middle" font-size="10" fill="#1a1a8c">N = −4.5 kN (tlak)</text>
<!-- T steber: 0 -->
<text x="10" y="397" font-size="11" font-weight="bold" fill="#006600">T</text>
<line x1="55" y1="404" x2="255" y2="404" stroke="#006600" stroke-width="2.5"/>
<text x="155" y="418" text-anchor="middle" font-size="10" fill="#006600">T = 0</text>
<!-- M steber: 0 -->
<text x="10" y="432" font-size="11" font-weight="bold" fill="#8B4500">M</text>
<line x1="55" y1="440" x2="255" y2="440" stroke="#8B4500" stroke-width="2.5"/>
<text x="155" y="454" text-anchor="middle" font-size="10" fill="#8B4500">M = 0</text>
<!-- labels -->
<text x="55" y="468" text-anchor="middle" font-size="10" fill="#555">A</text>
<text x="255" y="468" text-anchor="middle" font-size="10" fill="#555">C</text>

<!-- Vertical divider -->
<line x1="280" y1="325" x2="280" y2="570" stroke="#ddd" stroke-width="1"/>

<!-- === Prečka CD === -->
<text x="490" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">Prečka CD (x = 0→6m od C)</text>
<!-- N prečka: 0 -->
<text x="290" y="360" font-size="11" font-weight="bold" fill="#1a1a8c">N</text>
<line x1="320" y1="366" x2="680" y2="366" stroke="#1a1a8c" stroke-width="2.5"/>
<text x="500" y="380" text-anchor="middle" font-size="10" fill="#1a1a8c">N = 0</text>
<!-- T prečka: parabola +4.5 → 0 → -4.5 -->
<!-- baseline y=415, scale 5px/kN: 4.5*5=22.5px -->
<text x="290" y="397" font-size="11" font-weight="bold" fill="#006600">T</text>
<line x1="320" y1="415" x2="680" y2="415" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
<!-- T Area (+): x=320 (C) to x=500 (midpoint), height 22.5 above baseline -->
<polygon points="320,415 320,392 500,415" fill="rgba(0,140,0,0.18)" stroke="#006600" stroke-width="2"/>
<text x="400" y="402" text-anchor="middle" font-size="10" fill="#006600">+4.5</text>
<!-- T Area (−): x=500 (midpoint) to x=680 (D), 22.5 below baseline -->
<polygon points="500,415 680,437 680,415" fill="rgba(180,0,0,0.13)" stroke="#990000" stroke-width="2"/>
<text x="600" y="432" text-anchor="middle" font-size="10" fill="#990000">−4.5</text>
<text x="308" y="418" text-anchor="end" font-size="9" fill="#555">0</text>
<text x="308" y="395" text-anchor="end" font-size="9" fill="#006600">+4.5</text>
<text x="308" y="440" text-anchor="end" font-size="9" fill="#990000">−4.5</text>
<line x1="313" y1="392" x2="323" y2="392" stroke="#006600" stroke-width="1"/>
<!-- M prečka: parabola 0 → 6.75 → 0 -->
<!-- baseline y=500, scale 3px/kNm: 6.75*3=20.25px -->
<text x="290" y="455" font-size="11" font-weight="bold" fill="#8B4500">M</text>
<line x1="320" y1="500" x2="680" y2="500" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
<!-- M parabola: (320,500) → midpoint (500,480) → (680,500) -->
<!-- Points: x=1m(380): M=4.5*1-0.75=3.75 → y=500-11=489
             x=2m(440): M=9-3=6 → y=500-18=482
             x=3m(500): M=13.5-6.75=6.75 → y=500-20=480
             x=4m(560): M=18-12=6 → y=482
             x=5m(620): M=22.5-18.75=3.75 → y=489 -->
<path d="M 320,500 L 380,489 L 440,482 L 500,480 L 560,482 L 620,489 L 680,500 Z"
      fill="rgba(139,69,0,0.18)" stroke="#8B4500" stroke-width="2"/>
<text x="500" y="475" text-anchor="middle" font-size="12" fill="#8B4500" font-weight="bold">6.75 kNm</text>
<line x1="500" y1="480" x2="500" y2="500" stroke="#8B4500" stroke-width="1" stroke-dasharray="2,2"/>
<text x="308" y="503" text-anchor="end" font-size="9" fill="#555">0</text>
<text x="308" y="483" text-anchor="end" font-size="9" fill="#8B4500">6.75</text>
<line x1="313" y1="480" x2="323" y2="480" stroke="#8B4500" stroke-width="1"/>
<!-- x-labels prečka -->
<text x="320" y="516" text-anchor="middle" font-size="10" fill="#555">C(0)</text>
<text x="500" y="516" text-anchor="middle" font-size="10" fill="#555">sredina(3m)</text>
<text x="680" y="516" text-anchor="middle" font-size="10" fill="#555">D(6m)</text>

<!-- Note box -->
<rect x="290" y="526" width="400" height="34" rx="4" fill="#e8f4e8" stroke="#006600" stroke-width="1"/>
<text x="490" y="541" text-anchor="middle" font-size="10" fill="#005500" font-weight="bold">Mmax = 6.75 kNm pri x = 3m (sredina prečke)</text>
<text x="490" y="554" text-anchor="middle" font-size="10" fill="#005500">→ dimenzionira prerez prečke (M_dop ≥ 6.75 kNm)</text>
</svg>
