<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
<text x="380" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">NALOGA 5 — Sestavljena obremenitev M + Mt (Von Mises vs Tresca)</text>

<!-- ===== LEFT: Cross-section + stress state ===== -->
<text x="130" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">Gred d=5 cm, M + Mt</text>

<!-- Circle cross-section -->
<circle cx="130" cy="135" r="45" fill="rgba(180,180,220,0.2)" stroke="#336699" stroke-width="2.5"/>
<!-- Center dot -->
<circle cx="130" cy="135" r="3" fill="#336699"/>
<!-- Diameter annotation -->
<line x1="85" y1="135" x2="175" y2="135" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
<line x1="130" y1="90" x2="130" y2="180" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
<text x="175" y="150" font-size="11" fill="#555" font-weight="bold">d = 5 cm</text>

<!-- Bending moment M arrow (in-plane, upward curved) -->
<path d="M 75,110 Q 58,135 75,160" fill="none" stroke="#cc0000" stroke-width="2.5"/>
<polygon points="73,158 79,166 83,158" fill="#cc0000"/>
<text x="28" y="130" font-size="10" fill="#cc0000" font-weight="bold">M=150</text>
<text x="28" y="143" font-size="10" fill="#cc0000">kNcm</text>

<!-- Torsion Mt arrow (along axis) -->
<path d="M 155,90 Q 195,105 180,135 Q 195,165 155,180" fill="none" stroke="#006600" stroke-width="2.5"/>
<polygon points="156,176 162,184 168,178" fill="#006600"/>
<text x="195" y="120" font-size="10" fill="#006600" font-weight="bold">Mt=120</text>
<text x="195" y="133" font-size="10" fill="#006600">kNcm</text>

<!-- Critical point (bottom of circle, where σ is max) -->
<circle cx="130" cy="180" r="5" fill="#cc0000"/>
<text x="140" y="195" font-size="10" fill="#cc0000" font-weight="bold">kritična točka</text>

<!-- Stress state at critical point -->
<rect x="40" y="210" width="185" height="70" rx="4" fill="#fff8e8" stroke="#cc9900" stroke-width="1.5"/>
<text x="132" y="226" text-anchor="middle" font-size="10" font-weight="bold" fill="#885500">Napetostno stanje:</text>
<text x="52" y="243" font-size="10" fill="#333">σ = M/W = 150/12,27 = <tspan font-weight="bold" fill="#cc0000">12,22 kN/cm²</tspan></text>
<text x="52" y="259" font-size="10" fill="#333">τ = Mt/Wt = 120/24,54 = <tspan font-weight="bold" fill="#006600">4,89 kN/cm²</tspan></text>
<text x="52" y="275" font-size="9" fill="#555">W=πd³/32=12,27   Wt=2W=24,54 cm³</text>

<!-- ===== CENTER: Mohr circle for this stress state ===== -->
<text x="420" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">Mohrova krožnica (σ,τ)</text>

<!-- Axes, origin at (420,200) -->
<line x1="290" y1="200" x2="570" y2="200" stroke="#333" stroke-width="1.5"/>
<polygon points="566,195 576,200 566,205" fill="#333"/>
<text x="580" y="204" font-size="11" fill="#333">σ</text>
<line x1="420" y1="90" x2="420" y2="315" stroke="#333" stroke-width="1.5"/>
<polygon points="415,94 420,84 425,94" fill="#333"/>
<text x="395" y="86" font-size="11" fill="#333">τ</text>

<!-- Grid marks. Scale: ~8px/kNcm² -->
<!-- σ range: -2 to +17 kN/cm². Center: σsr=(12.22+0)/2=6.11, R=sqrt(6.11²+4.89²)=sqrt(37.3+23.9)=sqrt(61.2)=7.82 -->
<!-- σ1=6.11+7.82=13.93, σ2=6.11-7.82=-1.71 -->
<!-- Scale: 10px/kN/cm², origin at (420,200) -->
<!-- Center C at x=420+6.11*10=481, y=200 -->
<!-- R=7.82*10=78.2px -->
<!-- Point A (σx=12.22, τxy=4.89 → (σ,τ) in Mohr: x=422+122=542... wait scale=10px/kNcm²? -->

<!-- Let me use scale 12px/kNcm², origin at (380,200) -->
<!-- Center: σsr=6.11 → x=380+6.11*12=453, y=200 -->
<!-- R=7.82*12=94px -->
<!-- σ1=13.93 → x=380+13.93*12=547 -->
<!-- σ2=-1.71 → x=380-1.71*12=359 -->
<!-- Point A (σx=12.22, τxy=4.89): x=380+12.22*12=527, y=200+4.89*12=259 (τ+ downward) -->
<!-- Point B (σy=0, τyx=-4.89): x=380, y=200-4.89*12=141 -->

<!-- Mohr circle -->
<circle cx="453" cy="200" r="94" fill="rgba(100,150,255,0.08)" stroke="#336699" stroke-width="2.5"/>
<!-- Center -->
<circle cx="453" cy="200" r="4" fill="#336699"/>
<text x="440" y="192" font-size="9" fill="#336699">C(6,11; 0)</text>

<!-- Point A: σx=12.22, τ=4.89 → (527, 259) -->
<circle cx="527" cy="259" r="5" fill="#cc0000"/>
<text x="533" y="268" font-size="9" fill="#cc0000" font-weight="bold">A(12,22; 4,89)</text>
<text x="533" y="279" font-size="8" fill="#cc0000">x-ploskev</text>

<!-- Point B: σy=0, τ=-4.89 → (380, 141) -->
<circle cx="380" cy="141" r="5" fill="#006600"/>
<text x="308" y="141" font-size="9" fill="#006600" font-weight="bold">B(0; −4,89)</text>

<!-- Diameter line -->
<line x1="527" y1="259" x2="380" y2="141" stroke="#aaa" stroke-width="1" stroke-dasharray="3,2"/>

<!-- σ1 = 13.93 → x=547 -->
<circle cx="547" cy="200" r="5" fill="#cc0000"/>
<text x="548" y="188" font-size="9" fill="#cc0000" font-weight="bold">σ₁=13,93</text>

<!-- σ2 = -1.71 → x=359 -->
<circle cx="359" cy="200" r="5" fill="#006600"/>
<text x="320" y="188" font-size="9" fill="#006600" font-weight="bold">σ₂=−1,71</text>

<!-- Scale marks -->
<g font-size="8" fill="#888" text-anchor="middle">
  <line x1="380" y1="196" x2="380" y2="204" stroke="#aaa"/>
  <text x="380" y="214">0</text>
  <line x1="500" y1="196" x2="500" y2="204" stroke="#aaa"/>
  <text x="500" y="214">10</text>
</g>

<!-- R annotation -->
<line x1="453" y1="200" x2="527" y2="259" stroke="#888" stroke-width="1"/>
<text x="500" y="224" font-size="9" fill="#888">R=7,82</text>

<!-- ===== RIGHT: Comparison box ===== -->
<rect x="590" y="55" width="158" height="260" rx="5" fill="#f0f4ff" stroke="#336699" stroke-width="1.5"/>
<text x="669" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">VM vs Tresca</text>

<text x="600" y="95" font-size="9" fill="#555" font-weight="bold">Von Mises (faktor 3):</text>
<text x="600" y="110" font-size="9" fill="#333">σekv = √(σ²+3τ²)</text>
<text x="600" y="124" font-size="9" fill="#333">= √(149,3+71,7)</text>
<text x="600" y="138" font-size="9" fill="#333">= √221,0</text>
<text x="600" y="154" font-size="13" fill="#006600" font-weight="bold">= 14,87 kN/cm²</text>
<text x="600" y="169" font-size="11" fill="#006600">14,87 &lt; 15 ✓</text>

<line x1="598" y1="178" x2="742" y2="178" stroke="#ccc" stroke-width="1"/>

<text x="600" y="196" font-size="9" fill="#555" font-weight="bold">Tresca (faktor 4):</text>
<text x="600" y="211" font-size="9" fill="#333">σekv = √(σ²+4τ²)</text>
<text x="600" y="225" font-size="9" fill="#333">= √(149,3+95,7)</text>
<text x="600" y="239" font-size="9" fill="#333">= √245,0</text>
<text x="600" y="255" font-size="13" fill="#cc0000" font-weight="bold">= 15,65 kN/cm²</text>
<text x="600" y="271" font-size="11" fill="#cc0000">15,65 &gt; 15 ❌</text>
<text x="600" y="286" font-size="9" fill="#cc0000">PREKORAČENO!</text>
<text x="600" y="300" font-size="9" fill="#885500">Razlika: 5,2%</text>

<!-- ===== BOTTOM result table ===== -->
<rect x="40" y="350" width="540" height="130" rx="5" fill="#f8f8f8" stroke="#555" stroke-width="1.5"/>
<text x="310" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">ZAKLJUČEK</text>

<!-- Table -->
<rect x="52" y="378" width="516" height="22" fill="#336699" rx="2"/>
<text x="100" y="393" font-size="9" fill="white">Hipoteza</text>
<text x="220" y="393" font-size="9" fill="white">σ_ekv [kN/cm²]</text>
<text x="360" y="393" font-size="9" fill="white">σ_dop [kN/cm²]</text>
<text x="470" y="393" font-size="9" fill="white">Ocena</text>

<rect x="52" y="400" width="516" height="22" fill="#e8f8e8"/>
<text x="100" y="415" font-size="10" fill="#333">Von Mises</text>
<text x="235" y="415" font-size="10" fill="#006600" font-weight="bold">14,87</text>
<text x="370" y="415" font-size="10" fill="#333">15</text>
<text x="465" y="415" font-size="11" fill="#006600" font-weight="bold">✓ varno (komaj!)</text>

<rect x="52" y="422" width="516" height="22" fill="#ffe8e8"/>
<text x="100" y="437" font-size="10" fill="#333">Tresca</text>
<text x="235" y="437" font-size="10" fill="#cc0000" font-weight="bold">15,65</text>
<text x="370" y="437" font-size="10" fill="#333">15</text>
<text x="465" y="437" font-size="11" fill="#cc0000" font-weight="bold">❌ PREKORAČENO</text>

<text x="55" y="460" font-size="10" fill="#885500">⚠ Trik "Tresca 4, VM 3": edina razlika je faktor pred τ² !  Tresca je vedno bolj konzervativna.</text>
<text x="55" y="474" font-size="10" fill="#333">W = πd³/32 = 12,27 cm³   Wt = 2W = 24,54 cm³  (velja za polni krog!)</text>
</svg>
