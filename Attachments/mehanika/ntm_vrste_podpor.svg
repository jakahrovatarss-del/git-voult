<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
<text x="360" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Vrste podpor — reakcije in stopnje prostosti</text>

<!-- ── 1. NEPOMIČNI ČLENEK (pin / tečaj) ── -->
<text x="120" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">1. Nepomični členek</text>
<text x="120" y="73" text-anchor="middle" font-size="10" fill="#555">(tečaj, articulacija)</text>

<!-- Beam stub -->
<rect x="80" y="85" width="80" height="10" rx="2" fill="#555"/>
<!-- Pin triangle -->
<polygon points="120,85 104,116 136,116" fill="white" stroke="#333" stroke-width="2.5"/>
<!-- Ground line -->
<line x1="92" y1="119" x2="148" y2="119" stroke="#333" stroke-width="2"/>
<g stroke="#333" stroke-width="1">
  <line x1="92" y1="119" x2="97" y2="126"/>
  <line x1="102" y1="119" x2="107" y2="126"/>
  <line x1="112" y1="119" x2="117" y2="126"/>
  <line x1="122" y1="119" x2="127" y2="126"/>
  <line x1="132" y1="119" x2="137" y2="126"/>
  <line x1="142" y1="119" x2="147" y2="126"/>
</g>
<!-- Reactions arrows -->
<line x1="120" y1="140" x2="120" y2="110" stroke="#006600" stroke-width="2.5"/>
<polygon points="114,112 120,100 126,112" fill="#006600"/>
<text x="130" y="132" font-size="11" fill="#006600">Ry↑</text>
<line x1="60" y1="90" x2="90" y2="90" stroke="#006600" stroke-width="2.5"/>
<polygon points="88,84 95,90 88,96" fill="#006600"/>
<text x="38" y="93" font-size="11" fill="#006600">Rx→</text>
<!-- Info box -->
<rect x="62" y="148" width="116" height="52" rx="4" fill="#e8f4e8" stroke="#006600" stroke-width="1"/>
<text x="120" y="162" text-anchor="middle" font-size="10" fill="#005500" font-weight="bold">Reakcije: Rx, Ry</text>
<text x="120" y="176" text-anchor="middle" font-size="10" fill="#005500">2 neznani</text>
<text x="120" y="190" text-anchor="middle" font-size="10" fill="#005500">Preprečuje: pomik x, y</text>

<!-- ── 2. POMIČNI ČLENEK (roller) ── -->
<text x="300" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">2. Pomični členek</text>
<text x="300" y="73" text-anchor="middle" font-size="10" fill="#555">(roller, valj)</text>

<!-- Beam stub -->
<rect x="260" y="85" width="80" height="10" rx="2" fill="#555"/>
<!-- Roller triangle -->
<polygon points="300,85 284,116 316,116" fill="white" stroke="#333" stroke-width="2.5"/>
<!-- Circles (roller wheels) -->
<circle cx="286" cy="122" r="5" fill="none" stroke="#333" stroke-width="1.5"/>
<circle cx="300" cy="122" r="5" fill="none" stroke="#333" stroke-width="1.5"/>
<circle cx="314" cy="122" r="5" fill="none" stroke="#333" stroke-width="1.5"/>
<line x1="272" y1="128" x2="328" y2="128" stroke="#333" stroke-width="2"/>
<g stroke="#333" stroke-width="1">
  <line x1="272" y1="128" x2="277" y2="135"/>
  <line x1="282" y1="128" x2="287" y2="135"/>
  <line x1="292" y1="128" x2="297" y2="135"/>
  <line x1="302" y1="128" x2="307" y2="135"/>
  <line x1="312" y1="128" x2="317" y2="135"/>
  <line x1="322" y1="128" x2="327" y2="135"/>
</g>
<!-- Reaction: only Ry -->
<line x1="300" y1="148" x2="300" y2="110" stroke="#006600" stroke-width="2.5"/>
<polygon points="294,112 300,100 306,112" fill="#006600"/>
<text x="310" y="132" font-size="11" fill="#006600">Ry↑</text>
<!-- X free arrow -->
<line x1="240" y1="90" x2="260" y2="90" stroke="#999" stroke-width="1.5" stroke-dasharray="4,2"/>
<text x="226" y="93" font-size="9" fill="#999">x prost</text>
<!-- Info box -->
<rect x="242" y="148" width="116" height="52" rx="4" fill="#e8f4e8" stroke="#006600" stroke-width="1"/>
<text x="300" y="162" text-anchor="middle" font-size="10" fill="#005500" font-weight="bold">Reakcija: Ry</text>
<text x="300" y="176" text-anchor="middle" font-size="10" fill="#005500">1 neznanka</text>
<text x="300" y="190" text-anchor="middle" font-size="10" fill="#005500">Preprečuje: pomik y</text>

<!-- ── 3. TOGO VPETJE (fixed / clamped) ── -->
<text x="490" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">3. Togo vpetje</text>
<text x="490" y="73" text-anchor="middle" font-size="10" fill="#555">(konzolna podpora, fixed)</text>

<!-- Beam stub -->
<rect x="450" y="85" width="80" height="10" rx="2" fill="#555"/>
<!-- Wall (fixed) -->
<rect x="418" y="72" width="14" height="36" fill="#777" stroke="#333" stroke-width="1.5"/>
<g stroke="#333" stroke-width="1">
  <line x1="418" y1="72" x2="410" y2="80"/>
  <line x1="418" y1="80" x2="410" y2="88"/>
  <line x1="418" y1="88" x2="410" y2="96"/>
  <line x1="418" y1="96" x2="410" y2="104"/>
</g>
<!-- 3 Reactions -->
<line x1="490" y1="140" x2="490" y2="110" stroke="#006600" stroke-width="2.5"/>
<polygon points="484,112 490,100 496,112" fill="#006600"/>
<text x="500" y="128" font-size="11" fill="#006600">Ry↑</text>
<line x1="418" y1="90" x2="448" y2="90" stroke="#006600" stroke-width="2.5"/>
<polygon points="446,84 453,90 446,96" fill="#006600"/>
<text x="400" y="88" font-size="11" fill="#006600">Rx</text>
<!-- M reaction (curved arrow) -->
<path d="M 458,115 A 16,16 0 0 1 480,115" fill="none" stroke="#cc6600" stroke-width="2.5"/>
<polygon points="478,109 484,116 477,118" fill="#cc6600"/>
<text x="460" y="132" font-size="10" fill="#cc6600" font-weight="bold">M_A</text>
<!-- Info box -->
<rect x="422" y="148" width="136" height="52" rx="4" fill="#fff0e0" stroke="#cc6600" stroke-width="1"/>
<text x="490" y="162" text-anchor="middle" font-size="10" fill="#884400" font-weight="bold">Reakcije: Rx, Ry, M_A</text>
<text x="490" y="176" text-anchor="middle" font-size="10" fill="#884400">3 neznane</text>
<text x="490" y="190" text-anchor="middle" font-size="10" fill="#884400">Preprečuje: pomik x, y, zasuk</text>

<!-- ────────── SEPARATOR ────────── -->
<line x1="10" y1="214" x2="710" y2="214" stroke="#ccc" stroke-width="1"/>

<!-- ── 4. KONZOLA (internal hinge / členkovo stičišče) ── -->
<text x="120" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">4. Prost konec</text>
<text x="120" y="253" text-anchor="middle" font-size="10" fill="#555">(konzola, prosti konec)</text>

<!-- Beam stub, free end -->
<rect x="80" y="265" width="80" height="10" rx="2" fill="#555"/>
<!-- Wall left -->
<rect x="55" y="252" width="14" height="36" fill="#777" stroke="#333" stroke-width="1.5"/>
<g stroke="#333" stroke-width="1">
  <line x1="55" y1="252" x2="47" y2="260"/>
  <line x1="55" y1="260" x2="47" y2="268"/>
  <line x1="55" y1="268" x2="47" y2="276"/>
  <line x1="55" y1="276" x2="47" y2="284"/>
</g>
<!-- Prost konec — no support -->
<text x="160" y="275" font-size="11" fill="#555">← prost</text>
<text x="160" y="288" font-size="9" fill="#555">T=0, M=0</text>
<!-- Info box -->
<rect x="62" y="300" width="116" height="52" rx="4" fill="#f5f5ff" stroke="#9999cc" stroke-width="1"/>
<text x="120" y="314" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">Ni reakcij</text>
<text x="120" y="328" text-anchor="middle" font-size="10" fill="#333">Na prostem koncu:</text>
<text x="120" y="342" text-anchor="middle" font-size="10" fill="#333">T = 0 in M = 0 ✓</text>

<!-- ── 5. NOTRANJI ČLENEK (Gerber) ── -->
<text x="360" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">5. Notranji členek (Gerber)</text>
<text x="360" y="253" text-anchor="middle" font-size="10" fill="#555">(tečaj znotraj konstrukcije)</text>

<!-- Two beam segments with hinge -->
<rect x="250" y="265" width="80" height="10" rx="2" fill="#555"/>
<rect x="340" y="265" width="80" height="10" rx="2" fill="#555"/>
<!-- Hinge symbol (small circle) -->
<circle cx="335" cy="270" r="6" fill="white" stroke="#333" stroke-width="2"/>
<!-- Pin supports -->
<polygon points="270,265 256,296 284,296" fill="white" stroke="#333" stroke-width="2"/>
<line x1="244" y1="299" x2="296" y2="299" stroke="#333" stroke-width="2"/>
<polygon points="400,265 386,296 414,296" fill="white" stroke="#333" stroke-width="2"/>
<circle cx="389" cy="302" r="4" fill="none" stroke="#333" stroke-width="1.5"/>
<circle cx="401" cy="302" r="4" fill="none" stroke="#333" stroke-width="1.5"/>
<line x1="377" y1="308" x2="421" y2="308" stroke="#333" stroke-width="2"/>
<!-- Info box -->
<rect x="244" y="318" width="234" height="52" rx="4" fill="#f5f5ff" stroke="#9999cc" stroke-width="1"/>
<text x="361" y="332" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">Pri notranjem členku: M = 0 ✓</text>
<text x="361" y="346" text-anchor="middle" font-size="10" fill="#333">Omogoča zasuk — preprečuje pomik</text>
<text x="361" y="360" text-anchor="middle" font-size="10" fill="#333">Dodaten pogoj: ΣM_členek = 0</text>

<!-- ── POVZETEK TABELA ── -->
<rect x="520" y="224" width="186" height="152" rx="6" fill="#f9f9f9" stroke="#999" stroke-width="1.5"/>
<text x="613" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">Povzetek</text>
<line x1="520" y1="244" x2="706" y2="244" stroke="#ccc" stroke-width="1"/>
<text x="528" y="258" font-size="10" fill="#333">Nepomični členek → 2 reak.</text>
<text x="528" y="274" font-size="10" fill="#333">Pomični členek → 1 reakc.</text>
<text x="528" y="290" font-size="10" fill="#333">Togo vpetje → 3 reakc.</text>
<text x="528" y="306" font-size="10" fill="#333">Prost konec → 0 reakcij</text>
<line x1="520" y1="314" x2="706" y2="314" stroke="#ccc" stroke-width="1"/>
<text x="528" y="330" font-size="10" fill="#005500" font-weight="bold">Stat. določenost:</text>
<text x="528" y="346" font-size="10" fill="#005500">Σ reakcij = 3 → statično</text>
<text x="528" y="360" font-size="10" fill="#005500">določena konstrukcija</text>
<text x="528" y="374" font-size="10" fill="#005500">(za ravninski problem)</text>
</svg>
