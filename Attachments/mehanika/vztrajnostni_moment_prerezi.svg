<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg">
  <title>Vztrajnostni moment — najpogostejši prerezi</title>
  <rect width="760" height="500" fill="#ffffff"/>

  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">Aksijalni vztrajnostni moment — najpogostejši prerezi</text>

  <!-- ===== 1. PRAVOKOTNIK ===== -->
  <text x="95" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Pravokotnik</text>
  <!-- prerez -->
  <rect x="45" y="65" width="50" height="90" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <!-- osi -->
  <line x1="20" y1="110" x2="120" y2="110" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="70" y1="55" x2="70" y2="165" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- dimenzije -->
  <line x1="45" y1="170" x2="95" y2="170" stroke="#555" stroke-width="1"/>
  <line x1="45" y1="166" x2="45" y2="174" stroke="#555" stroke-width="1.5"/>
  <line x1="95" y1="166" x2="95" y2="174" stroke="#555" stroke-width="1.5"/>
  <text x="70" y="184" text-anchor="middle" font-size="11" fill="#555">b</text>
  <line x1="108" y1="65" x2="108" y2="155" stroke="#555" stroke-width="1"/>
  <line x1="104" y1="65" x2="112" y2="65" stroke="#555" stroke-width="1.5"/>
  <line x1="104" y1="155" x2="112" y2="155" stroke="#555" stroke-width="1.5"/>
  <text x="120" y="114" font-size="11" fill="#555">h</text>
  <!-- enačbe -->
  <text x="70" y="205" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="bold">I_z = b·h³/12</text>
  <text x="70" y="221" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="bold">I_y = h·b³/12</text>
  <text x="70" y="237" text-anchor="middle" font-size="11" fill="#888">A = b·h</text>
  <text x="8" y="113" font-size="10" fill="#dc2626">z</text>
  <text x="72" y="52" font-size="10" fill="#16a34a">y</text>

  <!-- ===== 2. KVADRAT ===== -->
  <text x="270" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Kvadrat (a×a)</text>
  <rect x="245" y="70" width="50" height="50" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="220" y1="95" x2="320" y2="95" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="270" y1="55" x2="270" y2="135" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="245" y1="132" x2="295" y2="132" stroke="#555" stroke-width="1"/>
  <line x1="245" y1="128" x2="245" y2="136" stroke="#555" stroke-width="1.5"/>
  <line x1="295" y1="128" x2="295" y2="136" stroke="#555" stroke-width="1.5"/>
  <text x="270" y="148" text-anchor="middle" font-size="11" fill="#555">a</text>
  <text x="270" y="175" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="bold">I_z = I_y = a⁴/12</text>
  <text x="270" y="191" text-anchor="middle" font-size="11" fill="#888">A = a²</text>
  <text x="210" y="98" font-size="10" fill="#dc2626">z</text>

  <!-- ===== 3. KROG ===== -->
  <text x="460" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Krog (premer d)</text>
  <circle cx="460" cy="105" r="40" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="405" y1="105" x2="515" y2="105" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="460" y1="55" x2="460" y2="155" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="460" y1="105" x2="500" y2="105" stroke="#555" stroke-width="1"/>
  <text x="482" y="100" font-size="11" fill="#555">r</text>
  <text x="460" y="180" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="bold">I_z = I_y = π·d⁴/64</text>
  <text x="460" y="196" text-anchor="middle" font-size="12" fill="#888">       = π·r⁴/4</text>
  <text x="460" y="212" text-anchor="middle" font-size="11" fill="#888">A = π·d²/4</text>
  <text x="395" y="108" font-size="10" fill="#dc2626">z</text>

  <!-- ===== 4. VOTEL PRAVOKOTNIK ===== -->
  <text x="650" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Votla cev (□)</text>
  <rect x="610" y="65" width="80" height="90" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="630" y="85" width="40" height="50" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="590" y1="110" x2="710" y2="110" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="650" y="185" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="bold">I = B·H³/12 − b·h³/12</text>
  <text x="650" y="201" text-anchor="middle" font-size="11" fill="#555">zunaj minus votlina</text>
  <text x="590" y="113" font-size="10" fill="#dc2626">z</text>
  <!-- B, H oznake -->
  <text x="697" y="113" font-size="11" fill="#1d4ed8">B</text>
  <text x="655" y="62" font-size="11" fill="#1d4ed8">H</text>
  <text x="673" y="113" font-size="10" fill="#555">b</text>
  <text x="642" y="83" font-size="10" fill="#555">h</text>

  <!-- ===== SPODNJI DEL: Steinerjeva formula ===== -->
  <line x1="20" y1="255" x2="740" y2="255" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="380" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Steinerjeva formula (vzporedna os)</text>

  <!-- Skica Steiner -->
  <rect x="60" y="295" width="60" height="80" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <!-- težišče -->
  <circle cx="90" cy="335" r="4" fill="#dc2626"/>
  <!-- os skozi težišče -->
  <line x1="30" y1="335" x2="150" y2="335" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- vzporedna os -->
  <line x1="30" y1="400" x2="150" y2="400" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4,3"/>
  <!-- razdalja e -->
  <line x1="160" y1="335" x2="160" y2="400" stroke="#555" stroke-width="1.5"/>
  <line x1="155" y1="335" x2="165" y2="335" stroke="#555" stroke-width="1.5"/>
  <line x1="155" y1="400" x2="165" y2="400" stroke="#555" stroke-width="1.5"/>
  <text x="172" y="372" font-size="13" fill="#555">e</text>
  <text x="90" y="330" text-anchor="middle" font-size="10" fill="#dc2626">težišče T</text>

  <!-- Formula Steiner -->
  <rect x="200" y="290" width="520" height="130" fill="#fefce8" rx="8" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="460" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">I_vzp = I_T + A · e²</text>
  <text x="460" y="345" text-anchor="middle" font-size="12" fill="#555">I_T = vztrajnostni moment okoli osi skozi težišče</text>
  <text x="460" y="365" text-anchor="middle" font-size="12" fill="#555">A = površina prereza</text>
  <text x="460" y="385" text-anchor="middle" font-size="12" fill="#555">e = razdalja med osema</text>
  <text x="460" y="408" text-anchor="middle" font-size="11" fill="#888">Uporaba: sestavljeni prerezi (I-profil, T-profil, sovprežni nosilci)</text>

  <!-- Legenda osi -->
  <line x1="20" y1="465" x2="50" y2="465" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="55" y="469" font-size="11" fill="#dc2626">os z (horizontalna, skozi težišče)</text>
  <line x1="250" y1="465" x2="280" y2="465" stroke="#16a34a" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="285" y="469" font-size="11" fill="#16a34a">os y (vertikalna, skozi težišče)</text>
  <line x1="490" y1="465" x2="520" y2="465" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="525" y="469" font-size="11" fill="#7c3aed">vzporedna os (Steiner)</text>
</svg>
