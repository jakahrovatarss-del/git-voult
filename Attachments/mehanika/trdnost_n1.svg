<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
<text x="380" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">NALOGA 1 — Dimenzioniranje pravokotnega prereza (upogib)</text>

<!-- ===== TOP: Nosila schema (y=40 to 180) ===== -->
<text x="20" y="52" font-size="11" font-weight="bold" fill="#444">Statična shema:</text>

<!-- Beam line y=100 -->
<line x1="80" y1="100" x2="580" y2="100" stroke="#333" stroke-width="3"/>

<!-- Support A left (triangle) at x=80 -->
<polygon points="80,100 65,125 95,125" fill="none" stroke="#333" stroke-width="2"/>
<line x1="55" y1="128" x2="105" y2="128" stroke="#333" stroke-width="2"/>
<text x="72" y="142" font-size="10" fill="#333">A</text>

<!-- Support B right (roller, triangle+circle) at x=580 -->
<polygon points="580,100 565,125 595,125" fill="none" stroke="#333" stroke-width="2"/>
<circle cx="580" cy="131" r="6" fill="none" stroke="#333" stroke-width="2"/>
<text x="572" y="148" font-size="10" fill="#333">B</text>

<!-- Distributed load q arrows (y=60 to y=100) -->
<g stroke="#336699" stroke-width="1.5" fill="#336699">
  <line x1="80" y1="60" x2="580" y2="60" stroke="#336699" stroke-width="2"/>
  <!-- Arrow shafts every 45px -->
  <line x1="100" y1="60" x2="100" y2="98"/>  <polygon points="97,95 100,103 103,95" fill="#336699"/>
  <line x1="145" y1="60" x2="145" y2="98"/>  <polygon points="142,95 145,103 148,95" fill="#336699"/>
  <line x1="190" y1="60" x2="190" y2="98"/>  <polygon points="187,95 190,103 193,95" fill="#336699"/>
  <line x1="235" y1="60" x2="235" y2="98"/>  <polygon points="232,95 235,103 238,95" fill="#336699"/>
  <line x1="280" y1="60" x2="280" y2="98"/>  <polygon points="277,95 280,103 283,95" fill="#336699"/>
  <line x1="325" y1="60" x2="325" y2="98"/>  <polygon points="322,95 325,103 328,95" fill="#336699"/>
  <line x1="370" y1="60" x2="370" y2="98"/>  <polygon points="367,95 370,103 373,95" fill="#336699"/>
  <line x1="415" y1="60" x2="415" y2="98"/>  <polygon points="412,95 415,103 418,95" fill="#336699"/>
  <line x1="460" y1="60" x2="460" y2="98"/>  <polygon points="457,95 460,103 463,95" fill="#336699"/>
  <line x1="505" y1="60" x2="505" y2="98"/>  <polygon points="502,95 505,103 508,95" fill="#336699"/>
  <line x1="550" y1="60" x2="550" y2="98"/>  <polygon points="547,95 550,103 553,95" fill="#336699"/>
</g>
<text x="320" y="52" text-anchor="middle" font-size="11" fill="#336699" font-weight="bold">q = 3 kN/m</text>

<!-- Force F at midpoint x=330 -->
<line x1="330" y1="40" x2="330" y2="98" stroke="#cc0000" stroke-width="2.5"/>
<polygon points="327,95 330,103 333,95" fill="#cc0000"/>
<text x="345" y="48" font-size="11" fill="#cc0000" font-weight="bold">F=10 kN</text>

<!-- Span annotation -->
<line x1="80" y1="160" x2="330" y2="160" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
<text x="205" y="172" text-anchor="middle" font-size="10" fill="#888">L/2 = 2,5 m</text>
<line x1="330" y1="160" x2="580" y2="160" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
<text x="455" y="172" text-anchor="middle" font-size="10" fill="#888">L/2 = 2,5 m</text>
<line x1="80" y1="154" x2="80" y2="166" stroke="#888" stroke-width="1"/>
<line x1="330" y1="154" x2="330" y2="166" stroke="#888" stroke-width="1"/>
<line x1="580" y1="154" x2="580" y2="166" stroke="#888" stroke-width="1"/>
<text x="330" y="185" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">L = 5 m</text>

<!-- Reactions -->
<line x1="80" y1="102" x2="80" y2="130" stroke="#006600" stroke-width="2.5"/>
<polygon points="77,104 80,96 83,104" fill="#006600"/>
<text x="50" y="120" font-size="10" fill="#006600" font-weight="bold">Ay=12,5</text>
<line x1="580" y1="102" x2="580" y2="130" stroke="#006600" stroke-width="2.5"/>
<polygon points="577,104 580,96 583,104" fill="#006600"/>
<text x="586" y="120" font-size="10" fill="#006600" font-weight="bold">By=12,5</text>

<!-- ===== M-DIAGRAM (y=200 to 310) ===== -->
<text x="20" y="215" font-size="11" font-weight="bold" fill="#444">M-diagram [kNm]:</text>
<!-- Baseline -->
<line x1="80" y1="310" x2="580" y2="310" stroke="#333" stroke-width="1.5"/>

<!-- Parabola-like M diagram: M(0)=0, M(2.5)=21.875, M(5)=0 -->
<!-- Approximate with polyline: sample at x=0,0.5,1,1.5,2,2.5,3,3.5,4,4.5,5m -->
<!-- Scale: 1m = 100px (80 to 580), Mmax=21.875 → 100px height (310-100=210) -->
<!-- Scale: 100px / 21.875 kNm = 4.57 px/kNm -->
<!-- M(x) = 12.5x - 1.5x² for x in [0,2.5], symmetric -->
<!-- x=0: M=0 → y=310 -->
<!-- x=0.5: M=5.875 → y=310-27=283 -->
<!-- x=1: M=11.0 → y=310-50=260 -->
<!-- x=1.5: M=15.375 → y=310-70=240 -->
<!-- x=2: M=19.0 → y=310-87=223 -->
<!-- x=2.5: M=21.875 → y=310-100=210 -->
<!-- Symmetric for x=2.5 to 5 -->
<polyline points="80,310 130,283 180,260 230,240 280,223 330,210 380,223 430,240 480,260 530,283 580,310" fill="rgba(200,220,255,0.4)" stroke="#336699" stroke-width="2.5"/>
<line x1="330" y1="210" x2="330" y2="310" stroke="#cc0000" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="330" y="203" text-anchor="middle" font-size="12" fill="#cc0000" font-weight="bold">Mmax = 21,875 kNm</text>
<text x="80" y="325" font-size="10" fill="#555">0</text>
<text x="575" y="325" font-size="10" fill="#555">0</text>
<text x="270" y="207" font-size="9" fill="#336699">⬆ paraboličen potek</text>

<!-- ===== RIGHT: Cross-section b×h ===== -->
<text x="630" y="52" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">Prerez b×h:</text>

<!-- Rectangle: b=15, h=30 → draw proportionally: 40×80 px -->
<rect x="595" y="90" width="70" height="140" fill="rgba(255,220,150,0.3)" stroke="#cc8800" stroke-width="2.5"/>
<!-- Centroid line -->
<line x1="595" y1="160" x2="665" y2="160" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
<!-- Dimension annotations -->
<line x1="672" y1="90" x2="672" y2="230" stroke="#666" stroke-width="1.5"/>
<polygon points="669,94 672,86 675,94" fill="#666"/>
<polygon points="669,226 672,234 675,226" fill="#666"/>
<text x="680" y="164" font-size="11" fill="#cc8800" font-weight="bold">h=30 cm</text>
<line x1="595" y1="240" x2="665" y2="240" stroke="#666" stroke-width="1.5"/>
<polygon points="599,237 591,240 599,243" fill="#666"/>
<polygon points="661,237 669,240 661,243" fill="#666"/>
<text x="617" y="255" font-size="11" fill="#cc8800" font-weight="bold">b=15 cm</text>

<!-- Stress distribution on cross-section (linear) -->
<text x="630" y="285" text-anchor="middle" font-size="10" font-weight="bold" fill="#444">Napetostna porazdelitev</text>
<!-- Triangle left (tension at bottom) -->
<polygon points="560,300 560,380 610,380" fill="rgba(0,100,200,0.2)" stroke="#336699" stroke-width="1.5"/>
<text x="530" y="345" font-size="9" fill="#336699" transform="rotate(-90,530,345)">nateg σmax</text>
<!-- Triangle right (compression at top) -->
<polygon points="700,300 700,380 650,300" fill="rgba(200,0,0,0.2)" stroke="#cc0000" stroke-width="1.5"/>
<text x="715" y="345" font-size="9" fill="#cc0000" transform="rotate(90,715,345)">tlak</text>
<line x1="610" y1="340" x2="650" y2="340" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
<text x="630" y="352" text-anchor="middle" font-size="9" fill="#888">n.o. (sredina)</text>

<!-- Result box -->
<rect x="40" y="340" width="520" height="55" rx="5" fill="#e8f4e8" stroke="#006600" stroke-width="1.5"/>
<text x="300" y="358" text-anchor="middle" font-size="10" font-weight="bold" fill="#005500">REZULTAT — Dimenzioniranje (b:h = 1:2)</text>
<text x="50" y="374" font-size="10" fill="#333">Mmax = 21,875 kNm = 2187,5 kNcm   →   W_min = 2187,5 cm³</text>
<text x="50" y="388" font-size="10" fill="#333">2b³/3 = 2187,5  →  b³ = 3281  →  b = 14,84 → </text>
<text x="330" y="388" font-size="11" fill="#006600" font-weight="bold">b = 15 cm, h = 30 cm  |  σ = 0,972 kN/cm² &lt; 1,0 ✓</text>

<!-- Result box bottom: σ formula -->
<rect x="40" y="400" width="520" height="35" rx="5" fill="#fffbe6" stroke="#cc9900" stroke-width="1.5"/>
<text x="50" y="415" font-size="10" fill="#333">σ = M/W = 2187,5 / 2250 = 0,972 kN/cm²      W_dej = 2·15³/3 = 2250 cm³</text>
<text x="50" y="428" font-size="10" fill="#006600">Izkoriščenost: 97,2%  ✓  Varno!</text>
</svg>
