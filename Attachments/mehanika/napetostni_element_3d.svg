<svg viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="12">

  <text x="340" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">Napetostni element — 3D napetostno stanje σ_ij</text>

  <!-- === KOCKA (izometrična projekcija) === -->
  <g transform="translate(170, 50)">

    <!-- Kocka koordinate (izometrično):
         Sprednja spodnja leva: (0,200)
         a=160px za stranico -->

    <!-- Sprednja ploskev (x-y) -->
    <polygon points="80,200 240,200 240,60 80,60" fill="#ddeeff" stroke="#2c5f8a" stroke-width="2"/>

    <!-- Desna ploskev (y-z) -->
    <polygon points="240,200 320,130 320,0 240,60" fill="#cce0f5" stroke="#2c5f8a" stroke-width="2"/>

    <!-- Zgornja ploskev (x-z) -->
    <polygon points="80,60 240,60 320,0 160,0" fill="#bbd6f0" stroke="#2c5f8a" stroke-width="2"/>

    <!-- Skrite robove (strehe nazaj) -->
    <line x1="80" y1="200" x2="160" y2="130" stroke="#2c5f8a" stroke-width="1" stroke-dasharray="5,3"/>
    <line x1="160" y1="130" x2="320" y2="130" stroke="#2c5f8a" stroke-width="1" stroke-dasharray="5,3"/>
    <line x1="160" y1="130" x2="160" y2="0" stroke="#2c5f8a" stroke-width="1" stroke-dasharray="5,3"/>

    <!-- === NORMALNE NAPETOSTI === -->

    <!-- σ_x (desno iz sprednje ploskve, x smer) -->
    <line x1="240" y1="130" x2="310" y2="130" stroke="#c0392b" stroke-width="2.5" marker-end="url(#redArr)"/>
    <text x="315" y="127" fill="#c0392b" font-weight="bold">σ_x</text>
    <!-- σ_x na levi ploskvi (vtisnjeno) -->
    <line x1="80" y1="130" x2="30" y2="130" stroke="#c0392b" stroke-width="2" marker-end="url(#redArr2)"/>

    <!-- σ_y (gor iz zgornje ploskve, y smer) -->
    <line x1="185" y1="60" x2="185" y2="5" stroke="#27ae60" stroke-width="2.5" marker-end="url(#greenArr)"/>
    <text x="190" y="20" fill="#27ae60" font-weight="bold">σ_y</text>
    <!-- σ_y spodaj -->
    <line x1="160" y1="200" x2="160" y2="250" stroke="#27ae60" stroke-width="2" marker-end="url(#greenArr2)"/>

    <!-- σ_z (diagonalno iz desne ploskve, z smer) -->
    <line x1="280" y1="65" x2="340" y2="30" stroke="#8e44ad" stroke-width="2.5" marker-end="url(#purpArr)"/>
    <text x="345" y="27" fill="#8e44ad" font-weight="bold">σ_z</text>
    <!-- σ_z nazaj -->
    <line x1="200" y1="165" x2="140" y2="195" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="4,2"/>

    <!-- === STRIŽNE NAPETOSTI === -->

    <!-- τ_xy na sprednji ploskvi (tangencialno) -->
    <line x1="160" y1="130" x2="185" y2="105" stroke="#e67e22" stroke-width="2" marker-end="url(#oranArr)"/>
    <text x="190" y="102" fill="#e67e22" font-size="11">τ_xy</text>

    <!-- τ_xz na desni ploskvi -->
    <line x1="270" y1="95" x2="295" y2="70" stroke="#e74c3c" stroke-width="2" marker-end="url(#redArr)"/>
    <text x="300" y="67" fill="#e74c3c" font-size="11">τ_xz</text>

    <!-- τ_yz na zgornji ploskvi -->
    <line x1="230" y1="28" x2="260" y2="14" stroke="#16a085" stroke-width="2" marker-end="url(#tealArr)"/>
    <text x="262" y="12" fill="#16a085" font-size="11">τ_yz</text>

    <!-- Koordinatne osi -->
    <line x1="80" y1="200" x2="20" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#axArr)"/>
    <text x="8" y="204" fill="#333" font-size="11">x</text>
    <line x1="80" y1="200" x2="80" y2="250" stroke="#333" stroke-width="1.5" marker-end="url(#axArr)"/>
    <text x="83" y="265" fill="#333" font-size="11">y</text>
    <line x1="80" y1="200" x2="130" y2="170" stroke="#333" stroke-width="1.5" marker-end="url(#axArr)"/>
    <text x="135" y="170" fill="#333" font-size="11">z</text>

  </g>

  <!-- === TENZOR (matrika) === -->
  <g transform="translate(480, 100)">
    <text x="0" y="18" font-weight="bold" fill="#2c3e50" font-size="13">Napetostni tenzor σ_ij:</text>

    <rect x="-10" y="28" width="190" height="110" rx="4" fill="#f0f7ff" stroke="#2980b9" stroke-width="1.5"/>

    <!-- Matrika -->
    <text x="5" y="58" fill="#2c3e50" font-size="12">⎡ σ_x   τ_xy  τ_xz ⎤</text>
    <text x="5" y="88" fill="#2c3e50" font-size="12">⎢ τ_xy  σ_y   τ_yz ⎥</text>
    <text x="5" y="118" fill="#2c3e50" font-size="12">⎣ τ_xz  τ_yz  σ_z  ⎦</text>

    <!-- Simetricnost -->
    <text x="0" y="155" fill="#555" font-size="11" font-style="italic">Simetričen: τ_ij = τ_ji</text>
    <text x="0" y="172" fill="#555" font-size="11">6 neodvisnih komponent</text>

    <!-- Konvencija -->
    <rect x="-10" y="185" width="190" height="90" rx="4" fill="#fff8e8" stroke="#e67e22" stroke-width="1.5"/>
    <text x="0" y="202" fill="#e67e22" font-weight="bold" font-size="12">Konvencija:</text>
    <text x="0" y="220" fill="#2c3e50" font-size="11">σ &gt; 0 → nateg</text>
    <text x="0" y="237" fill="#2c3e50" font-size="11">σ &lt; 0 → tlak</text>
    <text x="0" y="254" fill="#2c3e50" font-size="11">τ_ij = napetost na i-ploskvi</text>
    <text x="0" y="271" fill="#2c3e50" font-size="11">     v j-smeri</text>
  </g>

  <!-- Hookov zakon pod risbo -->
  <rect x="20" y="370" width="630" height="75" rx="6" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1"/>
  <text x="30" y="390" font-weight="bold" fill="#2c3e50" font-size="13">Hookov zakon (tenzorska oblika):</text>
  <text x="30" y="412" fill="#c0392b" font-size="12" font-weight="bold">σ_ij = λ·ε_v·δ_ij + 2G·ε_ij</text>
  <text x="250" y="412" fill="#555" font-size="11">kjer: λ = Eν/[(1+ν)(1−2ν)],  G = E/[2(1+ν)]</text>
  <text x="30" y="432" fill="#2980b9" font-size="12">ε_v = ε_x + ε_y + ε_z  (volumska dilatacija = sled tenzorja)</text>

  <defs>
    <marker id="redArr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c0392b"/>
    </marker>
    <marker id="redArr2" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto">
      <path d="M8,0 L8,6 L0,3 z" fill="#c0392b"/>
    </marker>
    <marker id="greenArr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#27ae60"/>
    </marker>
    <marker id="greenArr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#27ae60"/>
    </marker>
    <marker id="purpArr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8e44ad"/>
    </marker>
    <marker id="oranArr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e67e22"/>
    </marker>
    <marker id="tealArr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a085"/>
    </marker>
    <marker id="axArr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
