<svg viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="13">

  <!-- === KONSTRUKCIJA === -->
  <g transform="translate(30,20)">
    <text x="300" y="16" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">Prostoležeč nosilec — N, T, M diagrami</text>

    <!-- Nosilec -->
    <rect x="60" y="35" width="500" height="14" fill="#c8d8e8" stroke="#2c5f8a" stroke-width="1.5"/>

    <!-- Podpora A (trikotnik levo) -->
    <polygon points="60,49 45,72 75,72" fill="#e8c84a" stroke="#8a6200" stroke-width="1.5"/>
    <line x1="30" y1="72" x2="90" y2="72" stroke="#8a6200" stroke-width="2"/>
    <text x="60" y="86" text-anchor="middle" font-weight="bold" fill="#8a6200">A</text>

    <!-- Podpora B (trikotnik desno) -->
    <polygon points="560,49 545,72 575,72" fill="#e8c84a" stroke="#8a6200" stroke-width="1.5"/>
    <line x1="530" y1="72" x2="590" y2="72" stroke="#8a6200" stroke-width="2"/>
    <text x="560" y="86" text-anchor="middle" font-weight="bold" fill="#8a6200">B</text>

    <!-- Točkovna sila F na sredini -->
    <line x1="310" y1="0" x2="310" y2="34" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrowF)"/>
    <text x="320" y="20" fill="#c0392b" font-weight="bold">F = 12 kN</text>

    <!-- Oznaka razdalj -->
    <line x1="60" y1="95" x2="310" y2="95" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="310" y1="95" x2="560" y2="95" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="60" y1="91" x2="60" y2="99" stroke="#555" stroke-width="1"/>
    <line x1="310" y1="91" x2="310" y2="99" stroke="#555" stroke-width="1"/>
    <line x1="560" y1="91" x2="560" y2="99" stroke="#555" stroke-width="1"/>
    <text x="185" y="110" text-anchor="middle" fill="#555" font-size="12">3 m</text>
    <text x="435" y="110" text-anchor="middle" fill="#555" font-size="12">3 m</text>

    <!-- Reakcije -->
    <line x1="60" y1="73" x2="60" y2="52" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrowA)"/>
    <text x="25" y="68" fill="#27ae60" font-size="11" font-weight="bold">Ay=6kN</text>
    <line x1="560" y1="73" x2="560" y2="52" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrowA)"/>
    <text x="565" y="68" fill="#27ae60" font-size="11" font-weight="bold">By=6kN</text>
  </g>

  <!-- === N DIAGRAM === -->
  <g transform="translate(30,155)">
    <text x="0" y="14" font-weight="bold" fill="#2c3e50" font-size="13">N(x)</text>
    <text x="640" y="14" fill="#666" font-size="11" text-anchor="end">osna sila</text>
    <!-- ničelna os -->
    <line x1="60" y1="30" x2="560" y2="30" stroke="#888" stroke-width="1" stroke-dasharray="5,3"/>
    <!-- N=0 po celi dolžini (ni osne sile) -->
    <rect x="60" y="29" width="500" height="2" fill="#3498db"/>
    <text x="615" y="35" fill="#3498db" font-size="12" text-anchor="end">N = 0</text>
    <text x="310" y="22" text-anchor="middle" fill="#3498db" font-size="11">(ni osnih sil)</text>
  </g>

  <!-- === T DIAGRAM === -->
  <g transform="translate(30,215)">
    <text x="0" y="14" font-weight="bold" fill="#2c3e50" font-size="13">T(x)</text>
    <text x="640" y="14" fill="#666" font-size="11" text-anchor="end">prečna sila</text>
    <!-- os -->
    <line x1="60" y1="50" x2="560" y2="50" stroke="#888" stroke-width="1" stroke-dasharray="5,3"/>
    <!-- T=+6 levo -->
    <rect x="60" y="20" width="250" height="30" fill="#e8f6e8" stroke="#27ae60" stroke-width="1.5"/>
    <text x="185" y="40" text-anchor="middle" fill="#27ae60" font-weight="bold">+6 kN</text>
    <!-- T=-6 desno -->
    <rect x="310" y="50" width="250" height="30" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/>
    <text x="435" y="72" text-anchor="middle" fill="#c0392b" font-weight="bold">−6 kN</text>
    <!-- skok pri F -->
    <line x1="310" y1="20" x2="310" y2="80" stroke="#8e44ad" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="315" y="14" fill="#8e44ad" font-size="11">skok pri F</text>
    <!-- ničle -->
    <text x="55" y="54" text-anchor="end" fill="#888" font-size="11">0</text>
    <text x="565" y="54" fill="#888" font-size="11">0</text>
  </g>

  <!-- === M DIAGRAM === -->
  <g transform="translate(30,330)">
    <text x="0" y="14" font-weight="bold" fill="#2c3e50" font-size="13">M(x)</text>
    <text x="640" y="14" fill="#666" font-size="11" text-anchor="end">upogibni moment</text>
    <!-- os -->
    <line x1="60" y1="90" x2="560" y2="90" stroke="#888" stroke-width="1" stroke-dasharray="5,3"/>
    <!-- M trikotnik levo -->
    <polygon points="60,90 310,20 310,90" fill="#fef3e2" stroke="#e67e22" stroke-width="1.5"/>
    <!-- M trikotnik desno -->
    <polygon points="310,20 310,90 560,90" fill="#fef3e2" stroke="#e67e22" stroke-width="1.5"/>
    <!-- M_max -->
    <line x1="310" y1="20" x2="310" y2="90" stroke="#e67e22" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="320" y="30" fill="#e67e22" font-weight="bold">M_max = 18 kNm</text>
    <text x="320" y="45" fill="#e67e22" font-size="11">(pri sili F)</text>
    <!-- ničle -->
    <text x="55" y="94" text-anchor="end" fill="#888" font-size="11">0</text>
    <text x="565" y="94" fill="#888" font-size="11">0</text>
    <!-- sagging oznaka -->
    <text x="185" y="80" text-anchor="middle" fill="#e67e22" font-size="11">sagging (+)</text>

    <!-- legenda -->
    <text x="60" y="115" fill="#555" font-size="11">⬆ A = 0</text>
    <text x="310" y="115" text-anchor="middle" fill="#555" font-size="11">▲ max pri T=0</text>
    <text x="560" y="115" text-anchor="end" fill="#555" font-size="11">B = 0 ⬆</text>
  </g>

  <!-- === OBLIKA po obtežbi (legenda) === -->
  <g transform="translate(30,475)">
    <text x="0" y="14" fill="#555" font-size="11" font-style="italic">Oblika: točkovna sila → T skok, M trikotnik | porazdeljena q → T linearna, M parabola</text>
  </g>

  <!-- Puščice -->
  <defs>
    <marker id="arrowF" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c0392b"/>
    </marker>
    <marker id="arrowA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#27ae60"/>
    </marker>
  </defs>
</svg>
