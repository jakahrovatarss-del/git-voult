<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg">
  <title>Ravnotežje T-rame — zakaj N = 3·F</title>
  <rect width="720" height="380" fill="#ffffff"/>

  <!-- TRAM -->
  <rect x="80" y="120" width="480" height="18" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>

  <!-- Dimenzije -->
  <line x1="80" y1="105" x2="240" y2="105" stroke="#555" stroke-width="1"/>
  <line x1="80" y1="100" x2="80" y2="110" stroke="#555" stroke-width="1.5"/>
  <line x1="240" y1="100" x2="240" y2="110" stroke="#555" stroke-width="1.5"/>
  <text x="160" y="100" text-anchor="middle" font-size="13" fill="#555">2 m</text>

  <line x1="240" y1="105" x2="560" y2="105" stroke="#555" stroke-width="1"/>
  <line x1="560" y1="100" x2="560" y2="110" stroke="#555" stroke-width="1.5"/>
  <text x="400" y="100" text-anchor="middle" font-size="13" fill="#555">4 m</text>

  <line x1="80" y1="88" x2="560" y2="88" stroke="#aaa" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="80" y1="83" x2="80" y2="93" stroke="#aaa" stroke-width="1.5"/>
  <line x1="560" y1="83" x2="560" y2="93" stroke="#aaa" stroke-width="1.5"/>
  <text x="320" y="83" text-anchor="middle" font-size="12" fill="#888">skupaj 6 m</text>

  <!-- Leva podpora A -->
  <polygon points="80,138 68,160 92,160" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="60" y1="160" x2="100" y2="160" stroke="#888" stroke-width="2"/>
  <line x1="60" y1="164" x2="68" y2="172" stroke="#888" stroke-width="1.5"/>
  <line x1="72" y1="164" x2="80" y2="172" stroke="#888" stroke-width="1.5"/>
  <line x1="84" y1="164" x2="92" y2="172" stroke="#888" stroke-width="1.5"/>
  <text x="80" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">A</text>
  <text x="80" y="200" text-anchor="middle" font-size="11" fill="#888">(vrtišče)</text>

  <!-- Reakcija R_A -->
  <defs>
    <marker id="ag2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="270">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
    <marker id="ard2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <marker id="an2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="270">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <line x1="80" y1="158" x2="80" y2="128" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag2)"/>
  <text x="40" y="148" font-size="12" fill="#16a34a" font-weight="bold">R_A</text>

  <!-- Steber -->
  <rect x="232" y="138" width="18" height="160" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="241" y="230" text-anchor="middle" font-size="11" fill="#1d4ed8">steber</text>

  <!-- Spodnja podpora stebra -->
  <polygon points="241,298 231,318 251,318" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="223" y1="318" x2="259" y2="318" stroke="#888" stroke-width="2"/>
  <line x1="223" y1="322" x2="231" y2="330" stroke="#888" stroke-width="1.5"/>
  <line x1="235" y1="322" x2="243" y2="330" stroke="#888" stroke-width="1.5"/>
  <line x1="247" y1="322" x2="255" y2="330" stroke="#888" stroke-width="1.5"/>

  <!-- Sila N navzgor -->
  <line x1="241" y1="155" x2="241" y2="128" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#an2)"/>
  <text x="258" y="147" font-size="13" fill="#7c3aed" font-weight="bold">N</text>
  <text x="258" y="162" font-size="11" fill="#7c3aed">(reakcija stebra)</text>

  <!-- Sila F navzdol -->
  <line x1="560" y1="80" x2="560" y2="116" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ard2)"/>
  <text x="575" y="100" font-size="13" fill="#dc2626" font-weight="bold">F</text>

  <!-- Moment od F -->
  <path d="M 560 145 Q 560 200 500 220" stroke="#dc2626" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>
  <text x="510" y="240" font-size="12" fill="#dc2626">F × 6 m</text>
  <text x="510" y="255" font-size="11" fill="#dc2626">(v smeri ure)</text>

  <!-- Moment od N -->
  <path d="M 241 155 Q 241 200 180 215" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>
  <text x="85" y="235" font-size="12" fill="#7c3aed">N × 2 m</text>
  <text x="75" y="250" font-size="11" fill="#7c3aed">(nasprotno)</text>

  <!-- Enačba -->
  <rect x="160" y="310" width="400" height="55" fill="#fefce8" rx="8" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="360" y="333" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">ΣM_A = 0:   N · 2 = F · 6</text>
  <text x="360" y="353" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">N = 3 · F</text>
</svg>
