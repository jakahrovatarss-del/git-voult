<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="12">

  <text x="350" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">Hipoteze porušitve — Tresca vs. Von Mises</text>

  <!-- === Koordinatni sistem σ1-σ2 === -->
  <g transform="translate(50, 50)">
    <text x="210" y="18" text-anchor="middle" fill="#2c3e50" font-weight="bold" font-size="13">Pogoji plastičnosti v (σ₁, σ₂) ravnini</text>

    <!-- Osi -->
    <line x1="210" y1="310" x2="210" y2="20" stroke="#333" stroke-width="1.5" marker-end="url(#ax)"/>
    <text x="215" y="18" fill="#333" font-size="11">σ₂</text>
    <line x1="20" y1="175" x2="410" y2="175" stroke="#333" stroke-width="1.5" marker-end="url(#ax)"/>
    <text x="415" y="179" fill="#333" font-size="11">σ₁</text>

    <!-- Tresca šestkotnik (yield locus) -->
    <!-- σdop = 150px kot skala -->
    <!-- Tresca: |σ1|≤σy, |σ2|≤σy, |σ1-σ2|≤σy -->
    <!-- V pikslih: σy=130px -->
    <polygon points="210,45 340,45 340,175 210,305 80,305 80,175"
             fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="none"/>
    <text x="355" y="42" fill="#c0392b" font-weight="bold" font-size="11">Tresca</text>

    <!-- Von Mises elipsa -->
    <!-- Elipsa z a=150, b=150/√3≈87 zasučena 45° -->
    <ellipse cx="210" cy="175" rx="150" ry="87" transform="rotate(-45,210,175)"
             fill="#e8f4fb" stroke="#2980b9" stroke-width="2.5" fill-opacity="0.3"/>
    <text x="360" y="60" fill="#2980b9" font-weight="bold" font-size="11">Von Mises</text>

    <!-- Točka primera iz izpita 2019: σ1=385.4, σ2=-285.4 (normalizirano) -->
    <!-- Skalirano: σy=610MPa → 130px; 385.4→82px, 285.4→61px -->
    <circle cx="292" cy="236" r="6" fill="#e74c3c"/>
    <text x="298" y="233" fill="#e74c3c" font-size="11" font-weight="bold">2019 N3</text>
    <text x="298" y="247" fill="#e74c3c" font-size="10">(Tresca: ✗ prekoračeno)</text>

    <!-- Simetrijska os (diagonala) -->
    <line x1="20" y1="310" x2="400" y2="40" stroke="#95a5a6" stroke-width="1" stroke-dasharray="6,4"/>
    <text x="400" y="38" fill="#95a5a6" font-size="10">σ₁=σ₂</text>
  </g>

  <!-- === Tabela formul === -->
  <g transform="translate(490, 55)">
    <rect x="0" y="0" width="200" height="320" rx="6" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1"/>

    <text x="10" y="22" font-weight="bold" fill="#2c3e50" font-size="13">Formule:</text>

    <!-- Tresca -->
    <rect x="5" y="30" width="190" height="80" rx="4" fill="#fde8e8" stroke="#c0392b" stroke-width="1"/>
    <text x="10" y="48" fill="#c0392b" font-weight="bold" font-size="12">TRESCA</text>
    <text x="10" y="65" fill="#2c3e50" font-size="11">τ_max = (σ_max − σ_min)/2</text>
    <text x="10" y="82" fill="#c0392b" font-size="11" font-weight="bold">σ_ekv = σ_max − σ_min</text>
    <text x="10" y="98" fill="#555" font-size="10">= σ₁ − σ₃  (σ₁≥σ₂≥σ₃)</text>

    <!-- Von Mises -->
    <rect x="5" y="118" width="190" height="100" rx="4" fill="#e8f4fb" stroke="#2980b9" stroke-width="1"/>
    <text x="10" y="136" fill="#2980b9" font-weight="bold" font-size="12">VON MISES</text>
    <text x="10" y="153" fill="#2c3e50" font-size="10">σ_ekv = √[½((σ₁−σ₂)²+</text>
    <text x="10" y="168" fill="#2c3e50" font-size="10">  (σ₂−σ₃)²+(σ₃−σ₁)²)]</text>
    <text x="10" y="185" fill="#555" font-size="10">2D (σ₃=0):</text>
    <text x="10" y="200" fill="#2980b9" font-size="11" font-weight="bold">σ_ekv = √(σ²+3τ²)</text>
    <text x="10" y="215" fill="#555" font-size="10">ali √(σ₁²−σ₁σ₂+σ₂²)</text>

    <!-- Primerjava -->
    <rect x="5" y="226" width="190" height="80" rx="4" fill="#e8f8e8" stroke="#27ae60" stroke-width="1"/>
    <text x="10" y="244" fill="#27ae60" font-weight="bold" font-size="12">Primerjava:</text>
    <text x="10" y="261" fill="#2c3e50" font-size="11">σ_Tresca ≥ σ_VonMises</text>
    <text x="10" y="278" fill="#c0392b" font-size="11">Tresca = bolj konzervativna</text>
    <text x="10" y="295" fill="#2980b9" font-size="11">Von Mises = bolj natančna</text>
    <text x="10" y="312" fill="#555" font-size="10">(bliže eksperimentu)</text>
  </g>

  <!-- === Podmena besed === -->
  <rect x="50" y="390" width="640" height="22" rx="4" fill="#fef9e7"/>
  <text x="60" y="406" fill="#e67e22" font-size="11">Pogoj varnosti: σ_ekv ≤ σ_dop  |  Tresca: varnejši izbor za projektiranje  |  Von Mises: pogosteje pravi rezultat</text>

  <defs>
    <marker id="ax" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
