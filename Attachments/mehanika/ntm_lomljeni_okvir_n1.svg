<svg viewBox="0 0 880 680" xmlns="http://www.w3.org/2000/svg">
<rect width="880" height="680" fill="#1a1a2e"/>
<text x="440" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#e2e8f0" font-family="Arial">Lomljeni okvir — N, T, M diagrami (NotrSileVaje N1)</text>

<!-- PANEL: Frame -->
<rect x="20" y="38" width="390" height="370" rx="6" fill="#0d1b2a" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="215" y="58" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="Arial">Konstrukcija + FBD</text>

<!-- Frame: scale 52px/m, A=(130,400) C=(130,192) D=(338,192) B=(338,296) -->

<!-- Left column AC -->
<line x1="130" y1="400" x2="130" y2="192" stroke="#FFD700" stroke-width="6" stroke-linecap="round"/>
<!-- Horizontal beam CD -->
<line x1="130" y1="192" x2="338" y2="192" stroke="#FFD700" stroke-width="6" stroke-linecap="round"/>
<!-- Right column DB -->
<line x1="338" y1="192" x2="338" y2="296" stroke="#FFD700" stroke-width="6" stroke-linecap="round"/>

<!-- Point labels -->
<text x="112" y="404" font-size="13" fill="#90CAF9" font-family="Arial" font-weight="bold">A</text>
<text x="112" y="196" font-size="13" fill="#90CAF9" font-family="Arial" font-weight="bold">C</text>
<text x="344" y="196" font-size="13" fill="#90CAF9" font-family="Arial" font-weight="bold">D</text>
<text x="344" y="300" font-size="13" fill="#90CAF9" font-family="Arial" font-weight="bold">B</text>

<!-- Internal hinge at C: open circle -->
<circle cx="130" cy="192" r="7" fill="#0d1b2a" stroke="#F44336" stroke-width="2.5"/>

<!-- Rigid joint at D: filled corner -->
<rect x="330" y="184" width="16" height="16" fill="#FFD700" rx="2"/>

<!-- Pin support at A -->
<polygon points="130,400 114,422 146,422" fill="none" stroke="#90CAF9" stroke-width="2"/>
<line x1="105" y1="422" x2="155" y2="422" stroke="#90CAF9" stroke-width="2"/>
<line x1="108" y1="422" x2="102" y2="430" stroke="#60A5FA" stroke-width="1.2"/>
<line x1="117" y1="422" x2="111" y2="430" stroke="#60A5FA" stroke-width="1.2"/>
<line x1="126" y1="422" x2="120" y2="430" stroke="#60A5FA" stroke-width="1.2"/>
<line x1="135" y1="422" x2="129" y2="430" stroke="#60A5FA" stroke-width="1.2"/>
<line x1="144" y1="422" x2="138" y2="430" stroke="#60A5FA" stroke-width="1.2"/>
<line x1="153" y1="422" x2="147" y2="430" stroke="#60A5FA" stroke-width="1.2"/>

<!-- Pin support at B -->
<polygon points="338,296 322,318 354,318" fill="none" stroke="#90CAF9" stroke-width="2"/>
<line x1="313" y1="318" x2="363" y2="318" stroke="#90CAF9" stroke-width="2"/>
<line x1="316" y1="318" x2="310" y2="326" stroke="#60A5FA" stroke-width="1.2"/>
<line x1="325" y1="318" x2="319" y2="326" stroke="#60A5FA" stroke-width="1.2"/>
<line x1="334" y1="318" x2="328" y2="326" stroke="#60A5FA" stroke-width="1.2"/>
<line x1="343" y1="318" x2="337" y2="326" stroke="#60A5FA" stroke-width="1.2"/>
<line x1="352" y1="318" x2="346" y2="326" stroke="#60A5FA" stroke-width="1.2"/>
<line x1="361" y1="318" x2="355" y2="326" stroke="#60A5FA" stroke-width="1.2"/>

<!-- Arrowhead markers -->
<defs>
  <marker id="aF" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#FF9800"/></marker>
  <marker id="aR" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4CAF50"/></marker>
  <marker id="aRd" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#EF4444"/></marker>
</defs>

<!-- F2=2kN: horizontal right, at (130,296) — 2m above A -->
<line x1="68" y1="296" x2="122" y2="296" stroke="#FF9800" stroke-width="2.5" marker-end="url(#aF)"/>
<text x="32" y="293" font-size="11" fill="#FF9800" font-family="Arial">F₂=2kN</text>

<!-- F1=1kN: vertical down at D -->
<line x1="338" y1="150" x2="338" y2="184" stroke="#FF9800" stroke-width="2.5" marker-end="url(#aF)"/>
<text x="344" y="153" font-size="11" fill="#FF9800" font-family="Arial">F₁=1kN</text>

<!-- q on CD beam -->
<line x1="130" y1="168" x2="338" y2="168" stroke="#FF9800" stroke-width="1.5"/>
<line x1="153" y1="168" x2="153" y2="188" stroke="#FF9800" stroke-width="1.5" marker-end="url(#aF)"/>
<line x1="181" y1="168" x2="181" y2="188" stroke="#FF9800" stroke-width="1.5" marker-end="url(#aF)"/>
<line x1="209" y1="168" x2="209" y2="188" stroke="#FF9800" stroke-width="1.5" marker-end="url(#aF)"/>
<line x1="237" y1="168" x2="237" y2="188" stroke="#FF9800" stroke-width="1.5" marker-end="url(#aF)"/>
<line x1="265" y1="168" x2="265" y2="188" stroke="#FF9800" stroke-width="1.5" marker-end="url(#aF)"/>
<line x1="311" y1="168" x2="311" y2="188" stroke="#FF9800" stroke-width="1.5" marker-end="url(#aF)"/>
<text x="234" y="162" text-anchor="middle" font-size="10" fill="#FF9800" font-family="Arial">q = 0,125 kN/m</text>

<!-- Reactions (actual directions): -->
<!-- Ax=-1: left arrow from A -->
<line x1="130" y1="393" x2="82" y2="393" stroke="#4CAF50" stroke-width="2.5" marker-end="url(#aR)"/>
<text x="38" y="390" font-size="10" fill="#4CAF50" font-family="Arial">|Ax|=1</text>
<!-- Ay=-1.25: down arrow from A -->
<line x1="122" y1="400" x2="122" y2="440" stroke="#EF4444" stroke-width="2.5" marker-end="url(#aRd)"/>
<text x="88" y="453" font-size="10" fill="#EF4444" font-family="Arial">Ay=1,25↓</text>
<!-- By=2.75: up from B -->
<line x1="346" y1="296" x2="346" y2="252" stroke="#4CAF50" stroke-width="2.5" marker-end="url(#aR)"/>
<text x="352" y="268" font-size="10" fill="#4CAF50" font-family="Arial">By=2,75↑</text>
<!-- Bx=-1: left from B -->
<line x1="338" y1="308" x2="290" y2="308" stroke="#4CAF50" stroke-width="2.5" marker-end="url(#aR)"/>
<text x="256" y="308" font-size="10" fill="#4CAF50" font-family="Arial">|Bx|=1←</text>

<!-- Dimension annotations -->
<line x1="110" y1="296" x2="110" y2="400" stroke="#334155" stroke-width="1" stroke-dasharray="3,2"/>
<text x="98" y="352" font-size="10" fill="#475569" font-family="Arial" transform="rotate(-90,98,352)">2m</text>
<text x="220" y="205" text-anchor="middle" font-size="10" fill="#475569" font-family="Arial">4 m</text>
<text x="353" y="250" font-size="10" fill="#475569" font-family="Arial">2m</text>

<!-- Hinge label -->
<text x="100" y="188" font-size="10" fill="#F44336" font-family="Arial">M=0!</text>

<!-- PANEL: Results -->
<rect x="422" y="38" width="440" height="370" rx="6" fill="#0d1b2a" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="642" y="58" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="Arial">Rezultati</text>

<!-- Reactions -->
<text x="435" y="78" font-size="11" fill="#f59e0b" font-family="Arial" font-weight="bold">REAKCIJE:</text>
<text x="435" y="94" font-size="11" fill="#e2e8f0" font-family="monospace">Ax = −1,00 kN  (kaže levo)</text>
<text x="435" y="109" font-size="11" fill="#EF4444" font-family="monospace">Ay = −1,25 kN  (kaže dol ← nateg!)</text>
<text x="435" y="124" font-size="11" fill="#e2e8f0" font-family="monospace">Bx = −1,00 kN  (kaže levo)</text>
<text x="435" y="139" font-size="11" fill="#4CAF50" font-family="monospace">By = +2,75 kN  (kaže gor)</text>

<line x1="435" y1="148" x2="845" y2="148" stroke="#1e3a5f" stroke-width="1"/>

<!-- N column -->
<text x="435" y="164" font-size="11" fill="#2196F3" font-family="Arial" font-weight="bold">N (osna sila):</text>
<text x="435" y="179" font-size="10.5" fill="#2196F3" font-family="monospace">AC: +1,25 kN  NATEG (Ay vlečе navzdol)</text>
<text x="435" y="194" font-size="10.5" fill="#e2e8f0" font-family="monospace">CD: −1,00 kN  tlak (Cx se prelevi)</text>
<text x="435" y="209" font-size="10.5" fill="#EF4444" font-family="monospace">DB: −2,75 kN  TLAK (By pritisne navzgor)</text>

<line x1="435" y1="218" x2="845" y2="218" stroke="#1e3a5f" stroke-width="1"/>

<!-- T column -->
<text x="435" y="234" font-size="11" fill="#FF9800" font-family="Arial" font-weight="bold">T (prečna sila):</text>
<text x="435" y="249" font-size="10.5" fill="#e2e8f0" font-family="monospace">AC 0–2m:  −1,00 kN  (konst.)</text>
<text x="435" y="264" font-size="10.5" fill="#e2e8f0" font-family="monospace">AC 2–4m:  +1,00 kN  (skok F₂=+2)</text>
<text x="435" y="279" font-size="10.5" fill="#e2e8f0" font-family="monospace">CD:  −1,25 → −1,75 kN  (lin. q)</text>
<text x="435" y="294" font-size="10.5" fill="#e2e8f0" font-family="monospace">DB:  +1,00 kN  (konst., Bx)</text>

<line x1="435" y1="303" x2="845" y2="303" stroke="#1e3a5f" stroke-width="1"/>

<!-- M column -->
<text x="435" y="319" font-size="11" fill="#9C27B0" font-family="Arial" font-weight="bold">M (moment):</text>
<text x="435" y="334" font-size="10.5" fill="#e2e8f0" font-family="monospace">AC:  0 → −2,00 → 0 kNm  (lin.)</text>
<text x="435" y="349" font-size="10.5" fill="#EF4444" font-family="monospace">CD:  0 → −2,75 → −6,00 kNm  (par.)</text>
<text x="435" y="364" font-size="10.5" fill="#e2e8f0" font-family="monospace">DB:  0 → +2,00 kNm  (lin.)</text>
<text x="435" y="383" font-size="10.5" fill="#f59e0b" font-family="monospace">⚠ Točka D: preskok M za 4 kNm</text>
<text x="435" y="397" font-size="10.5" fill="#4CAF50" font-family="monospace">✓ Točka C (členek): M = 0</text>

<!-- === DIAGRAMS PANEL === -->
<rect x="20" y="420" width="842" height="248" rx="6" fill="#0d1b2a" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="441" y="440" text-anchor="middle" font-size="12" font-weight="bold" fill="#e2e8f0" font-family="Arial">N, T, M diagrami (razviti vzdolž konstrukcije)</text>

<!-- Member x-layout: AC(0-4m)=x:55-315px, CD(0-4m)=x:315-575, DB(0-2m)=x:575-705 -->
<!-- scale: 65px/m -->
<!-- Member dividers -->
<line x1="315" y1="450" x2="315" y2="658" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="575" y1="450" x2="575" y2="658" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>

<!-- Member labels -->
<text x="185" y="658" text-anchor="middle" font-size="10" fill="#475569" font-family="Arial">Steber AC (4 m)</text>
<text x="445" y="658" text-anchor="middle" font-size="10" fill="#475569" font-family="Arial">Prečka CD (4 m)</text>
<text x="640" y="658" text-anchor="middle" font-size="10" fill="#475569" font-family="Arial">Steber DB (2 m)</text>

<!-- N DIAGRAM: baseline y=485, scale 18px/kN -->
<text x="42" y="488" font-size="10" fill="#2196F3" font-family="Arial" font-weight="bold">N</text>
<line x1="55" y1="485" x2="710" y2="485" stroke="#334155" stroke-width="1"/>
<!-- N_AC=+1.25: 22px above baseline → y=463 to 485, x=55 to 315 -->
<rect x="55" y="462" width="260" height="23" fill="#2196F3" fill-opacity="0.3" stroke="#2196F3" stroke-width="1.5"/>
<text x="185" y="478" text-anchor="middle" font-size="10" fill="#2196F3" font-family="Arial">+1,25</text>
<!-- N_CD=-1: 18px below → y=485 to 503 -->
<rect x="315" y="485" width="260" height="18" fill="#EF4444" fill-opacity="0.3" stroke="#EF4444" stroke-width="1.5"/>
<text x="445" y="498" text-anchor="middle" font-size="10" fill="#EF4444" font-family="Arial">−1,00</text>
<!-- N_DB=-2.75: 18*2.75=50px below → y=485 to 535 — but cut to 44 -->
<rect x="575" y="485" width="130" height="44" fill="#EF4444" fill-opacity="0.3" stroke="#EF4444" stroke-width="1.5"/>
<text x="640" y="511" text-anchor="middle" font-size="10" fill="#EF4444" font-family="Arial">−2,75</text>

<!-- T DIAGRAM: baseline y=558, scale 18px/kN -->
<text x="42" y="562" font-size="10" fill="#FF9800" font-family="Arial" font-weight="bold">T</text>
<line x1="55" y1="558" x2="710" y2="558" stroke="#334155" stroke-width="1"/>
<!-- T_AC first half (0-2m): -1 → 18px below, x=55 to 185 -->
<rect x="55" y="558" width="130" height="18" fill="#FF9800" fill-opacity="0.3" stroke="#FF9800" stroke-width="1.5"/>
<text x="120" y="573" text-anchor="middle" font-size="9.5" fill="#FF9800" font-family="Arial">−1</text>
<!-- T_AC second half (2-4m): +1 → 18px above, x=185 to 315 -->
<rect x="185" y="540" width="130" height="18" fill="#4CAF50" fill-opacity="0.3" stroke="#4CAF50" stroke-width="1.5"/>
<text x="250" y="553" text-anchor="middle" font-size="9.5" fill="#4CAF50" font-family="Arial">+1</text>
<!-- T jump annotation -->
<text x="178" y="546" text-anchor="middle" font-size="8.5" fill="#f59e0b" font-family="Arial">↑F₂</text>
<!-- T_CD: linear from -1.25 to -1.75 → below baseline: 22.5 to 31.5px -->
<!-- trapezoid: (315,558) (315,580.5) (575,589.5) (575,558) -->
<polygon points="315,558 315,581 575,590 575,558" fill="#FF9800" fill-opacity="0.25" stroke="#FF9800" stroke-width="1.5"/>
<text x="445" y="578" text-anchor="middle" font-size="9.5" fill="#FF9800" font-family="Arial">−1,25 → −1,75</text>
<!-- T_DB: +1 → 18px above, x=575 to 705 -->
<rect x="575" y="540" width="130" height="18" fill="#4CAF50" fill-opacity="0.3" stroke="#4CAF50" stroke-width="1.5"/>
<text x="640" y="553" text-anchor="middle" font-size="9.5" fill="#4CAF50" font-family="Arial">+1</text>

<!-- M DIAGRAM: baseline y=636, scale 8px/kNm, positive = UP -->
<text x="42" y="636" font-size="10" fill="#9C27B0" font-family="Arial" font-weight="bold">M</text>
<line x1="55" y1="636" x2="710" y2="636" stroke="#334155" stroke-width="1"/>
<!-- M_AC: 0 at A (x=55), -2 at x=185 (2m), 0 at C (x=315) -->
<!-- triangle below: (55,636) (185,652) (315,636) — 16px depth for 2kNm -->
<polygon points="55,636 185,652 315,636" fill="#9C27B0" fill-opacity="0.25" stroke="#9C27B0" stroke-width="1.5"/>
<text x="185" y="650" text-anchor="middle" font-size="9.5" fill="#9C27B0" font-family="Arial">−2</text>
<!-- M_CD: parabolic 0→-2.75→-6 below baseline using bezier -->
<!-- At C: x=315,y=636; midpoint x=445,y=658 (2.75*8=22 below); at D: x=575,y=684... that's too far -->
<!-- Use scale 6px/kNm: 2.75*6=16.5 → 17; 6*6=36 -->
<!-- Bezier Q: (315,636) Q(445,653) (575,672) -->
<path d="M 315 636 Q 445 653 575 672" stroke="#9C27B0" stroke-width="1.5" fill="none"/>
<!-- Fill area: -->
<path d="M 315 636 Q 445 653 575 672 L 575 636 Z" fill="#9C27B0" fill-opacity="0.25"/>
<text x="445" y="660" text-anchor="middle" font-size="9.5" fill="#9C27B0" font-family="Arial">−2,75</text>
<text x="568" y="670" text-anchor="end" font-size="9.5" fill="#EF4444" font-family="Arial">−6!</text>
<!-- M_DB: 0 at B (x=575,y=636) to +2 at D (x=705): UP, 12px above -->
<!-- At D top: the -6 from CD and +2 from DB coexist at rigid joint D -->
<line x1="575" y1="636" x2="705" y2="624" stroke="#9C27B0" stroke-width="1.5"/>
<polygon points="575,636 575,624 705,624 705,636" fill="#9C27B0" fill-opacity="0.15"/>
<text x="640" y="622" text-anchor="middle" font-size="9.5" fill="#9C27B0" font-family="Arial">+2</text>

<!-- Key annotations -->
<text x="320" y="672" font-size="9" fill="#EF4444" font-family="Arial" font-weight="bold">D</text>
<text x="55" y="650" font-size="9" fill="#94a3b8" font-family="Arial">A</text>
<text x="307" y="650" font-size="9" fill="#F44336" font-family="Arial">C=0✓</text>
<text x="572" y="650" font-size="9" fill="#94a3b8" font-family="Arial">B=0</text>

<!-- kNm scale label -->
<text x="718" y="636" font-size="9" fill="#475569" font-family="Arial">[kNm]</text>
<text x="718" y="558" font-size="9" fill="#475569" font-family="Arial">[kN]</text>
<text x="718" y="485" font-size="9" fill="#475569" font-family="Arial">[kN]</text>
</svg>
