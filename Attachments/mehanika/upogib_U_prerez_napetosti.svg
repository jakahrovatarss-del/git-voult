<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <title>Ekstremne upogibne napetosti — U-prerez</title>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Ekstremne upogibne napetosti — U-prerez</text>

  <defs>
    <marker id="arr_r" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr_b" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr_g" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr_up" markerWidth="7" markerHeight="7" refX="3.5" refY="7" orient="auto">
      <path d="M0,7 L3.5,0 L7,7 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr_dim" markerWidth="6" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M6,0 L0,3 L6,6 Z" fill="#555"/>
    </marker>
    <marker id="arr_dim2" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <!-- ==================== LEVO: SHEMA NOSILCA ==================== -->
  <text x="170" y="45" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">Shema in M-diagram</text>

  <!-- Previs: x=30 (levi prosti konec), Podpora A: x=105 (1m=75px), Podpora B: x=292 (2.5m=187px) -->
  <!-- Scale: 75px = 1m -->

  <!-- Nosilci linija -->
  <rect x="30" y="148" width="262" height="12" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>

  <!-- Prosti konec (rdeča pika) -->
  <circle cx="30" cy="154" r="4" fill="#dc2626"/>

  <!-- Podpora A (členek) pri x=105 -->
  <polygon points="105,160 93,183 117,183" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="83" y1="183" x2="127" y2="183" stroke="#888" stroke-width="1.5"/>
  <line x1="83" y1="186" x2="91" y2="194" stroke="#888" stroke-width="1.2"/>
  <line x1="95" y1="186" x2="103" y2="194" stroke="#888" stroke-width="1.2"/>
  <line x1="107" y1="186" x2="115" y2="194" stroke="#888" stroke-width="1.2"/>
  <line x1="119" y1="186" x2="127" y2="194" stroke="#888" stroke-width="1.2"/>
  <text x="105" y="203" text-anchor="middle" font-size="11" fill="#1d4ed8" font-weight="bold">A</text>

  <!-- Podpora B (členek) pri x=292 -->
  <polygon points="292,160 280,183 304,183" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="270" y1="183" x2="314" y2="183" stroke="#888" stroke-width="1.5"/>
  <line x1="270" y1="186" x2="278" y2="194" stroke="#888" stroke-width="1.2"/>
  <line x1="282" y1="186" x2="290" y2="194" stroke="#888" stroke-width="1.2"/>
  <line x1="294" y1="186" x2="302" y2="194" stroke="#888" stroke-width="1.2"/>
  <line x1="306" y1="186" x2="314" y2="194" stroke="#888" stroke-width="1.2"/>
  <text x="292" y="203" text-anchor="middle" font-size="11" fill="#1d4ed8" font-weight="bold">B</text>

  <!-- Sila F na prostem koncu navzdol -->
  <line x1="30" y1="100" x2="30" y2="144" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr_r)"/>
  <text x="35" y="97" font-size="12" fill="#dc2626" font-weight="bold">F=10kN</text>

  <!-- Obtežba q v polju (puščice navzdol) -->
  <line x1="105" y1="110" x2="292" y2="110" stroke="#dc2626" stroke-width="1.5"/>
  <text x="198" y="107" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="bold">q=16 kN/m</text>
  <line x1="112" y1="110" x2="112" y2="144" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr_r)"/>
  <line x1="135" y1="110" x2="135" y2="144" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr_r)"/>
  <line x1="158" y1="110" x2="158" y2="144" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr_r)"/>
  <line x1="181" y1="110" x2="181" y2="144" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr_r)"/>
  <line x1="204" y1="110" x2="204" y2="144" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr_r)"/>
  <line x1="227" y1="110" x2="227" y2="144" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr_r)"/>
  <line x1="250" y1="110" x2="250" y2="144" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr_r)"/>
  <line x1="285" y1="110" x2="285" y2="144" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr_r)"/>

  <!-- Reakciji R_A in R_B navzgor -->
  <line x1="105" y1="195" x2="105" y2="170" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr_g)"/>
  <text x="65" y="215" font-size="10" fill="#16a34a" font-weight="bold">R_A=34kN</text>
  <line x1="292" y1="195" x2="292" y2="170" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr_g)"/>
  <text x="298" y="210" font-size="10" fill="#16a34a" font-weight="bold">R_B=16kN</text>

  <!-- Dimenzije -->
  <line x1="30" y1="222" x2="105" y2="222" stroke="#555" stroke-width="1" marker-start="url(#arr_dim)" marker-end="url(#arr_dim2)"/>
  <text x="67" y="235" text-anchor="middle" font-size="10" fill="#555">1 m</text>
  <line x1="105" y1="222" x2="292" y2="222" stroke="#555" stroke-width="1" marker-start="url(#arr_dim)" marker-end="url(#arr_dim2)"/>
  <text x="198" y="235" text-anchor="middle" font-size="10" fill="#555">2,5 m</text>

  <!-- ===== M DIAGRAM (spodaj) ===== -->
  <text x="40" y="258" font-size="10" fill="#7c3aed" font-weight="bold">M [kNm]:</text>
  <!-- Bazna linija -->
  <line x1="30" y1="290" x2="295" y2="290" stroke="#aaa" stroke-width="1"/>

  <!-- M na previsu: od 0 do -10 (pri A) — linearno -->
  <!-- -10 kNm → 45px navzgor (neg = navzgor v diagramu) -->
  <polygon points="30,290 105,290 105,245" fill="#fde8e8" stroke="#dc2626" stroke-width="1.5" fill-opacity="0.6"/>
  <text x="55" y="243" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="bold">-10</text>

  <!-- M v polju: parabolično od -10 pri A, vrh +8 pri ξ=1.5m, nazaj 0 pri B -->
  <!-- ξ=1.5m = 112px od A → x=217 -->
  <!-- +8 kNm → 36px navzdol od baze -->
  <path d="M105,245 Q217,326 292,290" fill="#e0f2fe" stroke="#1d4ed8" stroke-width="2" fill-opacity="0.6"/>
  <line x1="105" y1="245" x2="105" y2="290" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="220" y="335" text-anchor="middle" font-size="10" fill="#1d4ed8" font-weight="bold">+8</text>
  <text x="217" y="348" text-anchor="middle" font-size="9" fill="#555">(ξ=1,5m od A)</text>

  <!-- Vertikala pri max M v polju -->
  <line x1="217" y1="290" x2="217" y2="326" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- ==================== SREDINA: U-PREREZ ==================== -->
  <line x1="375" y1="30" x2="375" y2="500" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="520" y="45" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">U-prerez (40×15×7 cm)</text>

  <!-- U-prerez (odprtina navzgor), scale: 6px/cm pri B=40cm=240px, H=15cm=90px, t=7cm=42px -->
  <!-- Center horizontalno pri x=520 -->
  <!-- Spodnji rob pri y=330, zgornji pri y=240 -->
  <!-- Zunaj: 240px wide, 90px high -->

  <!-- Leva stena (7×15) -->
  <rect x="400" y="240" width="42" height="90" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>
  <!-- Desna stena (7×15) -->
  <rect x="638" y="240" width="42" height="90" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>
  <!-- Spodnja pasnica (26×7) = notranja širina 26cm=156px -->
  <rect x="442" y="288" width="156" height="42" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>

  <!-- Oznaka dimenzij -->
  <!-- B = 40cm (spodaj) -->
  <line x1="400" y1="345" x2="680" y2="345" stroke="#555" stroke-width="1" marker-start="url(#arr_dim)" marker-end="url(#arr_dim2)"/>
  <text x="540" y="360" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">B = 40 cm</text>
  <!-- H = 15cm (desno) -->
  <line x1="696" y1="240" x2="696" y2="330" stroke="#555" stroke-width="1" marker-start="url(#arr_dim)" marker-end="url(#arr_dim2)"/>
  <text x="716" y="290" font-size="11" fill="#555" font-weight="bold">H=15cm</text>
  <!-- t = 7cm (leva stena) -->
  <line x1="384" y1="240" x2="384" y2="282" stroke="#7c3aed" stroke-width="1" marker-start="url(#arr_dim)" marker-end="url(#arr_dim2)"/>
  <text x="345" y="265" font-size="10" fill="#7c3aed">t=7cm</text>

  <!-- Nevtralna os (y_T = 5.6428cm od spodaj = 33.9px od spodnjega roba) -->
  <!-- spodnji rob pri y=330, NO pri y=330-33.9=296 -->
  <line x1="385" y1="296" x2="700" y2="296" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="378" y="294" font-size="10" fill="#dc2626" font-weight="bold" text-anchor="end">NO</text>

  <!-- e_zg = 9.357cm = 56.1px navzgor od NO → y=296-56=240 -->
  <line x1="540" y1="296" x2="540" y2="240" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="534" y1="296" x2="546" y2="296" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="534" y1="240" x2="546" y2="240" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="555" y="272" font-size="10" fill="#7c3aed">e_zg=9,36cm</text>

  <!-- e_sp = 5.64cm = 33.9px navzdol od NO → y=296+34=330 -->
  <line x1="560" y1="296" x2="560" y2="330" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="554" y1="296" x2="566" y2="296" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="554" y1="330" x2="566" y2="330" stroke="#16a34a" stroke-width="1.5"/>
  <text x="572" y="318" font-size="10" fill="#16a34a">e_sp=5,64cm</text>

  <!-- y_T oznaka -->
  <text x="420" y="302" font-size="10" fill="#dc2626">y_T=5,64cm</text>

  <!-- ==================== DESNO: PORAZDELITEV NAPETOSTI ==================== -->
  <line x1="740" y1="30" x2="740" y2="500" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="820" y="45" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">σ pri podpori A</text>
  <text x="820" y="60" text-anchor="middle" font-size="10" fill="#555">(M = −10 kNm)</text>

  <!-- Prerez za napetosti (skica prereza pri x=800) -->
  <!-- Prerez: zmanjšan, samo obrisa -->
  <rect x="775" y="155" width="20" height="90" fill="none" stroke="#aaa" stroke-width="1"/>
  <rect x="885" y="155" width="20" height="90" fill="none" stroke="#aaa" stroke-width="1"/>
  <rect x="795" y="203" width="90" height="42" fill="none" stroke="#aaa" stroke-width="1"/>

  <!-- Nevtralna os za napetostni diagram -->
  <line x1="756" y1="211" x2="916" y2="211" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="750" y="209" font-size="9" fill="#dc2626" text-anchor="end">NO</text>

  <!-- Napetostni trikotnik pri A (M = -10 kNm, hogging: zgoraj nateg, spodaj tlak) -->
  <!-- Zgornji rob (nateg, +) pri y=155: σ_top = +1.500 → 60px desno -->
  <!-- Spodnji rob (tlak, -) pri y=245: σ_bot = -0.904 → 36px levo -->
  <!-- NO pri y=211 (x=790 = os) -->

  <!-- Natezna (+) stran (desno) -->
  <polygon points="790,155 850,155 790,211" fill="#fde8e8" stroke="#dc2626" stroke-width="1.5" fill-opacity="0.7"/>
  <text x="860" y="155" font-size="10" fill="#dc2626" font-weight="bold">+1,50</text>
  <text x="856" y="167" font-size="9" fill="#dc2626">kN/cm²</text>
  <text x="856" y="179" font-size="9" fill="#dc2626">(nateg)</text>

  <!-- Tlačna (-) stran (levo) -->
  <polygon points="790,245 754,245 790,211" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" fill-opacity="0.7"/>
  <text x="718" y="248" font-size="10" fill="#1d4ed8" font-weight="bold">−0,90</text>
  <text x="718" y="260" font-size="9" fill="#1d4ed8">kN/cm²</text>
  <text x="718" y="272" font-size="9" fill="#1d4ed8">(tlak)</text>

  <!-- ==================== SPODAJ: REZULTATI ==================== -->
  <line x1="20" y1="400" x2="880" y2="400" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="450" y="425" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Ekstremne napetosti:</text>
  <rect x="20" y="432" width="410" height="20" fill="#fef9c3" rx="3" stroke="#fbbf24" stroke-width="1"/>
  <text x="225" y="446" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="bold">Max nateg: +1,50 kN/cm² — zgornji rob pri podpori A</text>
  <rect x="450" y="432" width="430" height="20" fill="#dbeafe" rx="3" stroke="#93c5fd" stroke-width="1"/>
  <text x="665" y="446" text-anchor="middle" font-size="11" fill="#1d4ed8" font-weight="bold">Max tlak: −1,20 kN/cm² — zgornji rob pri ξ=1,5m od A</text>

  <text x="450" y="475" text-anchor="middle" font-size="10" fill="#555">⚠ U-prerez asimetričen (e_zg &gt; e_sp) → zgornji rob kritičen pri obeh predznaknih momentih</text>
</svg>
