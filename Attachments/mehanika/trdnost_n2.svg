<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
<text x="380" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">NALOGA 2 — Euler uklon konzole (β=2, kvadraten prerez a×a)</text>

<!-- ===== LEFT: 4 Euler cases overview ===== -->
<text x="135" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">Eulerove oblike vpetja</text>

<!-- Case 1: pin-pin β=1 -->
<line x1="60" y1="80" x2="60" y2="200" stroke="#aaa" stroke-width="3"/>
<circle cx="60" cy="80" r="5" fill="none" stroke="#555" stroke-width="2"/>
<circle cx="60" cy="200" r="5" fill="none" stroke="#555" stroke-width="2"/>
<path d="M 60,110 Q 85,140 60,170" fill="none" stroke="#336699" stroke-width="2.5" stroke-dasharray="5,3"/>
<text x="60" y="220" text-anchor="middle" font-size="10" fill="#336699">β=1</text>
<text x="60" y="232" text-anchor="middle" font-size="9" fill="#555">P-P</text>

<!-- Case 2: fixed-pin β=0.7 -->
<rect x="100" y="195" width="24" height="8" fill="#555"/>
<line x1="100" y1="199" x2="100" y2="80" stroke="#aaa" stroke-width="3"/>
<circle cx="100" cy="80" r="5" fill="none" stroke="#555" stroke-width="2"/>
<path d="M 100,120 Q 118,140 100,165" fill="none" stroke="#336699" stroke-width="2.5" stroke-dasharray="5,3"/>
<text x="105" y="220" text-anchor="middle" font-size="10" fill="#336699">β=0,7</text>
<text x="105" y="232" text-anchor="middle" font-size="9" fill="#555">V-P</text>

<!-- Case 3: fixed-fixed β=0.5 -->
<rect x="143" y="195" width="24" height="8" fill="#555"/>
<rect x="143" y="72" width="24" height="8" fill="#555"/>
<line x1="155" y1="200" x2="155" y2="80" stroke="#aaa" stroke-width="3"/>
<path d="M 155,130 Q 165,140 155,152" fill="none" stroke="#336699" stroke-width="2.5" stroke-dasharray="5,3"/>
<text x="158" y="220" text-anchor="middle" font-size="10" fill="#336699">β=0,5</text>
<text x="158" y="232" text-anchor="middle" font-size="9" fill="#555">V-V</text>

<!-- Case 4: KONZOLA fixed-free β=2 (HIGHLIGHTED) -->
<rect x="193" y="195" width="24" height="8" fill="#cc0000"/>
<line x1="205" y1="200" x2="205" y2="80" stroke="#cc0000" stroke-width="3.5"/>
<path d="M 205,120 Q 240,140 205,170" fill="none" stroke="#cc0000" stroke-width="3" stroke-dasharray="none"/>
<text x="210" y="68" font-size="10" fill="#cc0000" font-weight="bold">Prosto</text>
<rect x="185" y="60" width="50" height="175" rx="3" fill="rgba(255,0,0,0.05)" stroke="#cc0000" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="210" y="220" text-anchor="middle" font-size="11" fill="#cc0000" font-weight="bold">β=2 !</text>
<text x="210" y="233" text-anchor="middle" font-size="9" fill="#cc0000">V-Prosto</text>

<!-- lu annotation for case 4 -->
<line x1="242" y1="80" x2="242" y2="200" stroke="#cc0000" stroke-width="1.5"/>
<polygon points="239,84 242,76 245,84" fill="#cc0000"/>
<polygon points="239,196 242,204 245,196" fill="#cc0000"/>
<text x="252" y="145" font-size="10" fill="#cc0000">lu=2L</text>

<!-- ===== CENTER: Main problem ===== -->
<text x="430" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">Naša konzola (β=2)</text>

<!-- Steber konzola at x=430, y=90 to 290 (L=4m) -->
<!-- Fixed base at bottom -->
<rect x="398" y="288" width="64" height="12" fill="#555" rx="2"/>
<line x1="390" y1="292" x2="474" y2="292" stroke="#555" stroke-width="1.5"/>

<!-- Steber itself -->
<rect x="420" y="90" width="20" height="200" fill="rgba(200,160,80,0.3)" stroke="#cc8800" stroke-width="2"/>

<!-- Force F at top -->
<line x1="430" y1="45" x2="430" y2="88" stroke="#cc0000" stroke-width="2.5"/>
<polygon points="427,85 430,93 433,85" fill="#cc0000"/>
<text x="450" y="58" font-size="11" fill="#cc0000" font-weight="bold">F = 30 kN</text>

<!-- lu = 2L arrow -->
<line x1="477" y1="90" x2="477" y2="290" stroke="#336699" stroke-width="1.5"/>
<polygon points="474,94 477,86 480,94" fill="#336699"/>
<polygon points="474,286 477,294 480,286" fill="#336699"/>
<text x="484" y="195" font-size="10" fill="#336699">lu=2·400=800 cm</text>
<text x="484" y="208" font-size="10" fill="#336699">β=2</text>

<!-- L arrow -->
<line x1="540" y1="90" x2="540" y2="290" stroke="#888" stroke-width="1"/>
<polygon points="537,94 540,86 543,94" fill="#888"/>
<polygon points="537,286 540,294 543,286" fill="#888"/>
<text x="548" y="195" font-size="10" fill="#888">L=400 cm</text>

<!-- Buckled shape (dashed) -->
<path d="M 430,90 Q 465,160 430,290" fill="none" stroke="#cc0000" stroke-width="2" stroke-dasharray="6,4"/>

<!-- Cross-section a×a -->
<rect x="390" y="310" width="32" height="32" fill="rgba(200,160,80,0.3)" stroke="#cc8800" stroke-width="2"/>
<text x="406" y="356" text-anchor="middle" font-size="10" fill="#cc8800">a×a</text>

<!-- ===== RIGHT: Calculation box ===== -->
<rect x="580" y="60" width="165" height="330" rx="5" fill="#f8f8f8" stroke="#555" stroke-width="1.5"/>
<text x="662" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Reševanje</text>

<text x="590" y="100" font-size="10" fill="#555" font-weight="bold">1. lu = β·L</text>
<text x="590" y="114" font-size="10" fill="#333">  = 2·400 = 800 cm</text>

<text x="590" y="132" font-size="10" fill="#555" font-weight="bold">2. Fk = ν·F</text>
<text x="590" y="146" font-size="10" fill="#333">  = 3·30 = 90 kN</text>

<text x="590" y="164" font-size="10" fill="#555" font-weight="bold">3. Iz Euler: Imin=a⁴/12</text>
<text x="590" y="178" font-size="9" fill="#333">  Fk = π²·E·a⁴/(12·lu²)</text>
<text x="590" y="192" font-size="9" fill="#333">  a⁴ = 90·800²·12/(π²·1000)</text>
<text x="590" y="206" font-size="10" fill="#cc0000" font-weight="bold">  a⁴ = 70 030 cm⁴</text>
<text x="590" y="222" font-size="12" fill="#cc0000" font-weight="bold">  a = 16,27 → 17 cm</text>

<text x="590" y="244" font-size="10" fill="#555" font-weight="bold">4. Vitkost λ</text>
<text x="590" y="258" font-size="9" fill="#333">  i = 17/√12 = 4,91 cm</text>
<text x="590" y="272" font-size="9" fill="#333">  λ = 800/4,91 = 163</text>
<text x="590" y="286" font-size="9" fill="#333">  λe = π√(1000/1,2) = 90,7</text>
<text x="590" y="300" font-size="10" fill="#006600" font-weight="bold">  λ=163 &gt; λe=90,7 ✓ Euler</text>

<text x="590" y="318" font-size="10" fill="#555" font-weight="bold">5. Kontrola tlaka</text>
<text x="590" y="332" font-size="9" fill="#333">  A = 17² = 289 cm²</text>
<text x="590" y="346" font-size="9" fill="#333">  σ = 30/289 = 0,104 kN/cm²</text>
<text x="590" y="360" font-size="10" fill="#006600" font-weight="bold">  0,104 &lt;&lt; 1,2 ✓ Uklon vlada!</text>

<!-- Summary box at bottom -->
<rect x="40" y="410" width="530" height="55" rx="5" fill="#fffbe6" stroke="#cc9900" stroke-width="1.5"/>
<text x="295" y="428" text-anchor="middle" font-size="11" font-weight="bold" fill="#885500">ZAKLJUČEK: Uklon je kritičen, ne trdnost!</text>
<text x="50" y="443" font-size="10" fill="#333">σ_tlak = 0,104 kN/cm² (bi prenesel 12× večjo silo po trdnosti)</text>
<text x="50" y="456" font-size="10" fill="#333">Euler uklon nastopi pri F=30 kN — uklon nadzoruje dimenzioniranje  →  </text>
<text x="440" y="456" font-size="11" fill="#006600" font-weight="bold">a = 17 cm ✓</text>
</svg>
